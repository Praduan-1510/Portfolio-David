<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="CareBridge">
  <title>CareBridge</title>
  <defs>
    <!-- Aurora brand gradient, §7.4 -->
    <linearGradient id="cb-brand" x1="8%" y1="0%" x2="78%" y2="100%">
      <stop offset="0%"  stop-color="#5AA9FF"/>
      <stop offset="58%" stop-color="#2F80ED"/>
      <stop offset="100%" stop-color="#1E66CC"/>
    </linearGradient>
    <!-- specular sheen raking across the upper-left, the iOS 26 signature -->
    <radialGradient id="cb-sheen" cx="20%" cy="-6%" r="88%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity=".34"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- iOS continuous-corner squircle -->
    <clipPath id="cb-squircle">
      <path d="M50 0C11.5 0 0 11.5 0 50s11.5 50 50 50 50-11.5 50-50S88.5 0 50 0Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cb-squircle)">
    <rect width="100" height="100" fill="url(#cb-brand)"/>
    <rect width="100" height="100" fill="url(#cb-sheen)"/>
  </g>

  <!-- Mark, scaled and centred within the icon's optical safe area -->
  <g transform="translate(50 52.5) scale(1.62) translate(-24 -28)"
     fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 35.5A19.5 19.5 0 0 1 43.5 35.5" stroke-width="4"   opacity=".55"/>
    <path d="M12.5 35.5A11.5 11.5 0 0 1 35.5 35.5" stroke-width="4"  opacity=".78"/>
    <path d="M24 26.5V34.5M20 30.5H28"             stroke-width="3.8"/>
  </g>
</svg>
