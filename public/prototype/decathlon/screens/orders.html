<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decathlon · My orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/decathlon.css">
<style>
  /* Pixel-matched to Order history.png (393 x 852).
     Header block absolute: back @33,34 · title @63 cap 34 · chips y84..112 · divider y122..125.
     Cards x28..365 (338 x 137), first at y152, pitch 151 (gap 14). */
  .oh-back { left: 22px; top: 20px; width: 30px; height: 44px; display: grid; place-items: center; color: #000; border-radius: 8px; }
  .oh-chips { left: 32px; top: 84px; display: flex; gap: 8px; }
  .oh-chips .chip { height: 29px; padding: 0; font-size: 14.8px; letter-spacing: -.1px; }
  .oh-chips .chip[data-value="all"] { width: 47px; }
  .oh-chips .chip[data-value="active"] { width: 74px; }
  .oh-chips .chip[data-value="delivered"] { width: 96px; }
  .oh-chips .chip[data-value="returns"] { width: 92px; }
  .oh-divider { left: 0; top: 122px; width: 393px; height: 4px; background: linear-gradient(180deg, var(--divider-soft) 0 1px, var(--border) 1px 4px); }

  .oh-list { padding: 152px 0 0 28px; width: 366px; }
  .oh-list .order-card { position: relative; width: 338px; height: 137px; padding: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--border); cursor: pointer; transition: box-shadow var(--dur), transform var(--dur) var(--ease-out); }
  .oh-list .order-card + .order-card { margin-top: 14px; }
  .oh-list .order-card:active { transform: scale(.99); box-shadow: inset 0 0 0 1.5px var(--steel); }
  .oh-list .order-card[hidden] { display: none; }
  .oh-list .order-card__head { position: absolute; left: 12px; right: 12px; top: 7px; height: 29px; }
  .oh-list .order-card__head .order-card__id { margin-top: 1px; }
  .oh-list .order-card__id { font-size: 12.1px; font-weight: 700; letter-spacing: 0; color: var(--order-id); padding: 8px 0; }
  .oh-list .pill { height: 29px; padding: 0 16px; font-size: 14px; font-weight: 600; }
  
  .oh-list .order-card__body { position: absolute; left: 12px; right: 12px; top: 45px; height: 46px; margin: 0; display: flex; align-items: center; gap: 0; }
  .oh-list .order-card__thumbs { gap: 4px; flex-shrink: 0; }
  .oh-list .thumb { width: 46px; height: 46px; border-radius: 6px; }
  .oh-list .thumb:only-child { width: 45px; height: 45px; margin-left: 27px; }
  .oh-list .order-card__meta { margin-left: 19px; font-size: 14px; line-height: 20px; color: #000; white-space: nowrap; }
  .oh-list .order-card__thumbs:has(.thumb:only-child) + .order-card__meta { margin-left: 46px; }
  .oh-list .order-card__meta .price { font-size: 15.8px; font-weight: 700; margin-top: 3px; line-height: 22px; }
  .oh-list .order-card__actions { position: absolute; left: 31px; right: 31px; top: 101px; margin: 0; display: grid; grid-template-columns: 118px 118px; justify-content: space-between; gap: 0; }
  .oh-list .order-card__actions--one { grid-template-columns: 1fr; }
  .oh-list .order-card__actions .btn { height: 29px; font-size: 14px; font-weight: 400; color: #111; box-shadow: inset 0 0 0 1.5px var(--steel); border-radius: 8px; padding: 0 6px; }
  .oh-list .order-card__actions .btn.is-loading::after { border-color: rgba(15,150,219,.25); border-top-color: var(--brand); }

  /* Below the fold (flow) */
  .oh-more { padding: 44px 28px calc(var(--tabbar-h) + 32px); }
  .oh-help { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--profile); box-shadow: inset 0 0 0 1px var(--border); }
  .oh-help__t { font-size: 14px; font-weight: 600; color: #000; }
  .oh-help__s { font-size: 12px; color: var(--muted-2); margin-top: 1px; }
  .oh-help .chev { color: #000; }
  .oh-count { font-size: 12px; color: var(--muted-2); text-align: center; margin-top: 14px; }
  .oh-empty { margin: 0 28px 0 0; padding: 36px 12px 8px; }
</style>
</head>
<body>
<main class="screen" aria-label="My orders" id="ordersScreen">
  <a class="abs oh-back tap" href="account.html" data-go="back" aria-label="Back"><svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5 1.5 8.5l7 7"/></svg></a>
  <h1 class="t" style="left:61px;top:32px;font-size:20px;font-weight:600;color:#000">My orders</h1>

  <div class="abs oh-chips" id="chips" data-group aria-label="Filter orders">
    <button class="chip is-active tap" role="tab" type="button" data-value="all">All</button>
    <button class="chip tap" role="tab" type="button" data-value="active">Active</button>
    <button class="chip tap" role="tab" type="button" data-value="delivered">Delivered</button>
    <button class="chip tap" role="tab" type="button" data-value="returns">Returns</button>
  </div>
  <div class="abs oh-divider" role="separator"></div>

  <div class="oh-list" id="list" aria-live="polite"></div>
  <div class="oh-empty empty-state" id="empty" hidden>
    <div class="empty-state__icon"><i data-icon="box" data-size="40" data-sw="1.6"></i></div>
    <h3 id="emptyT">No active orders</h3>
    <p id="emptyP">Orders that are being packed or are on the way will show up here.</p>
    <a class="btn btn--primary btn--md tap" href="home.html" id="emptyBtn">Start shopping</a>
  </div>

  <div class="oh-more">
    <a class="oh-help tap" href="help.html?topic=orders">
      <span class="icon-tile"><i data-icon="headset" data-size="22"></i></span>
      <span class="grow"><span class="oh-help__t" style="display:block">Need help with an order?</span><span class="oh-help__s" style="display:block">Returns, refunds, delivery and invoices</span></span>
      <i class="chev" data-icon="chevron" data-size="18" data-sw="2"></i>
    </a>
    <p class="oh-count" id="count"></p>
  </div>

  <nav data-tabbar="account"></nav>
</main>

<script src="../assets/js/app.js"></script>
<script>
  (function () {
    const D = window.Deca, $ = D.$, $$ = D.$$;
    const list = $('#list');
    const GROUP = { all: () => true, active: (s) => s === 'processing' || s === 'transit', delivered: (s) => s === 'delivered', returns: (s) => s === 'return-requested' || s === 'returned' };
    const EMPTY = {
      all: ['No orders yet', 'When you place an order it will appear here with live tracking.', 'Start shopping', 'home.html'],
      active: ['No active orders', 'Orders that are being packed or are on the way will show up here.', 'Start shopping', 'home.html'],
      delivered: ['Nothing delivered yet', 'Delivered orders show up here so you can buy again or write a review.', 'Browse categories', 'category.html'],
      returns: ['No returns', 'Return or exchange a delivered item within its return window from the order page.', 'See delivered orders', null],
    };
    let filter = 'all';

    function render() {
      const orders = D.orders.list();
      list.innerHTML = orders.map((o) => D.orderCard(o)).join('');
      // Richer screen-reader names for the whole-card tap target
      $$('.order-card', list).forEach((c) => {
        const o = D.orders.get(c.dataset.order);
        c.setAttribute('aria-label', `Order #${o.id}, ${D.orders.status(o.status)}, ${D.orders.count(o)} ${D.orders.count(o) === 1 ? 'item' : 'items'}, ${D.fmt(o.total)}`);
      });
      D.hydrate(list);
      apply();
      const n = orders.length;
      $('#count').textContent = n ? `Showing ${n} ${n === 1 ? 'order' : 'orders'} from the last 12 months` : '';
    }

    function apply() {
      let shown = 0;
      $$('.order-card', list).forEach((c) => { const ok = GROUP[filter](c.dataset.status); c.hidden = !ok; if (ok) shown++; });
      const e = EMPTY[filter];
      $('#empty').hidden = shown > 0;
      if (!shown) {
        $('#emptyT').textContent = e[0]; $('#emptyP').textContent = e[1];
        const b = $('#emptyBtn'); b.textContent = e[2];
        if (e[3]) { b.setAttribute('href', e[3]); b.onclick = null; }
        else { b.setAttribute('href', 'orders.html'); b.onclick = (ev) => { ev.preventDefault(); $('#chips [data-value="delivered"]').click(); }; }
      }
    }

    $('#chips').addEventListener('change', (e) => { filter = e.detail; apply(); D.haptic(6); });

    // Whole card opens the order (buttons / links inside keep their own action)
    list.addEventListener('click', (e) => {
      if (e.target.closest('a, button')) return;
      const card = e.target.closest('.order-card'); if (card) location.href = `order-detail.html?id=${card.dataset.order}`;
    });

    // Deep link a filter: orders.html?filter=returns
    const f = D.q('filter'); if (f && GROUP[f]) { const chip = $(`#chips [data-value="${f}"]`); chip && chip.click(); }

    render();
    D.on('orders', render);
  })();
</script>
</body>
</html>
