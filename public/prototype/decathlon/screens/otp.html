<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decathlon · Verify code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/decathlon.css">
<style>
  /* Auth shell: gradient band (Welcome palette) + white card that overlaps it */
  .auth-hero { position: relative; height: 184px; margin: 0 calc(-1 * var(--gutter)); color: #fff; overflow: hidden;
    background: linear-gradient(180deg, #012639 0px, #075881 104px, #1296DB 184px); }
  .auth-hero::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(112deg, rgba(255,255,255,.055) 0 2px, transparent 2px 34px); -webkit-mask-image: linear-gradient(90deg, transparent, #000 60%); mask-image: linear-gradient(90deg, transparent, #000 60%); }
  .auth-hero__back { position: absolute; left: 14px; top: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; color: #fff; }
  .auth-hero__back svg { width: 9px; height: 15px; }
  .auth-hero__logo { position: absolute; left: 50%; top: 66px; width: 150px; transform: translateX(-50%); }
  .auth-hero__tag { position: absolute; left: 0; right: 0; top: 100px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: #9FD5F1; }
  .auth-hero__help { position: absolute; right: 14px; top: 20px; height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.14); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #fff; }
  .auth-hero__help svg { width: 16px; height: 16px; }
  .auth-card { position: relative; margin: -34px calc(-1 * var(--gutter)) 0; padding: 26px var(--gutter) 0; background: #fff; border-radius: 24px 24px 0 0; }
  .auth-title { font-size: 24px; font-weight: 700; color: #000; line-height: 1.25; letter-spacing: -.2px; }
  .auth-sub { font-size: 14px; color: var(--muted-2); line-height: 1.5; margin-top: 4px; }
  .auth-sub b { color: #000; font-weight: 600; }
  .auth-or { display: flex; align-items: center; gap: 12px; margin: 24px 0 16px; font-size: 12px; color: var(--muted-2); }
  .auth-or::before, .auth-or::after { content: ''; flex: 1; height: 1px; background: var(--divider-soft); }
  .auth-foot { text-align: center; font-size: 14px; color: var(--muted-2); margin-top: 22px; }
  .auth-foot a { color: var(--brand); font-weight: 600; padding: 10px 2px; }
  .auth-legal { text-align: center; font-size: 11.5px; line-height: 1.55; color: var(--muted); margin: 18px auto 0; max-width: 300px; }
  .auth-legal button, .auth-legal a { color: var(--steel); text-decoration: underline; text-underline-offset: 2px; }
  .tel-prefix { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; color: #111 !important; padding-right: 10px; margin-right: 2px; box-shadow: inset -1px 0 0 var(--border); height: 24px; }
  .flag { width: 20px; height: 14px; border-radius: 2px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
  .flag i { flex: 1; } .flag i:nth-child(1) { background: #FF9933; } .flag i:nth-child(2) { background: #fff; display: grid; place-items: center; } .flag i:nth-child(3) { background: #138808; }
  .flag i:nth-child(2)::after { content: ''; width: 4px; height: 4px; border-radius: 50%; box-shadow: inset 0 0 0 1px #000080; }
  .segmented button { text-align: center; }
  .option .avatar { width: 40px; height: 40px; }
  .social { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border-radius: var(--r); font-size: 15px; font-weight: 600; }
  .social--google { background: #fff; color: #111; box-shadow: inset 0 0 0 1px var(--border); }
  .social--apple { background: #000; color: #fff; }
  .social svg { width: 20px; height: 20px; }
  .otp-wrap { margin-top: 26px; }
  .otp input { width: 48px; height: 56px; }
  .otp-status { min-height: 20px; margin-top: 12px; font-size: 13px; line-height: 1.45; color: var(--muted-2); display: flex; align-items: center; gap: 6px; }
  .otp-status svg { width: 16px; height: 16px; flex-shrink: 0; }
  .otp-status.is-error { color: var(--danger); }
  .otp-status.is-ok { color: var(--ok); font-weight: 500; }
  .otp-status .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--brand); animation: spin 700ms linear infinite; }
  .otp-row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .otp-row .text-btn[disabled] { color: var(--muted); }
  .demo-hint { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; background: var(--surface); color: var(--navy); font-size: 12px; box-shadow: inset 0 0 0 1px var(--border); }
  .demo-hint b { font-weight: 600; letter-spacing: 1px; }
  .demo-hint svg { width: 14px; height: 14px; color: var(--brand); }
  .edit-link { color: var(--brand); font-weight: 500; padding: 8px 2px; }
  .otp-help { display: flex; gap: 12px; align-items: flex-start; margin-top: 28px; }
  .verified { text-align: center; padding: 26px 0 4px; }
  .verified .result__circle { width: 120px; height: 120px; }
  .verified .result__circle svg { width: 72px; height: 72px; }

</style>
</head>
<body>
<main class="page page--bare" aria-label="Verify code">
  <header class="auth-hero">
    <a class="auth-hero__back tap" href="login.html" data-go="back" aria-label="Back"><svg viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5 1.5 8.5l7 7"/></svg></a>
    
    <span class="wordmark wordmark--white auth-hero__logo" role="img" aria-label="Decathlon"></span>
    <p class="auth-hero__tag">Verification</p>
  </header>
  <section class="auth-card" id="card">
    <div id="enter">
      <h1 class="auth-title enter" style="--i:0">Enter the code</h1>
      <p class="auth-sub enter" style="--i:1">We sent a 6-digit code to <b id="to">+91 98311 20456</b> <a class="edit-link tap" id="edit" href="login.html">Edit</a></p>
      <ol class="steps" id="steps" aria-label="Sign-up progress" style="--n:3;margin:18px 0 0" hidden><li class="done">Details</li><li class="current">Verify</li><li>Location</li></ol>
      <div class="otp-wrap enter" style="--i:2"><div class="otp" id="otp" data-length="6" role="group" aria-label="One-time code"></div></div>
      <p class="otp-status" id="status" role="status" aria-live="polite">The code expires in 10 minutes</p>
      <div class="otp-row">
        <button class="text-btn text-btn--brand" type="button" id="resend" data-countdown="30">Resend code</button>
        <button class="demo-hint tap" type="button" id="demo" aria-label="Fill the demo code 123456"><i data-icon="info" data-size="14"></i>Demo code <b>123456</b></button>
      </div>
      <button class="btn btn--primary btn--lg tap" type="button" id="verify" style="margin-top:24px" disabled><span>Verify</span></button>
      <div class="otp-help panel panel--surface" style="margin-top:28px">
        <span class="icon-tile" style="width:36px;height:36px;background:#fff"><i data-icon="phone" data-size="18"></i></span>
        <span class="grow" style="font-size:13px;line-height:1.5;color:var(--muted-2)"><b style="display:block;color:#000;font-weight:600;font-size:14px">Not getting the SMS?</b>Check your network, or have the code read out on a call.</span>
      </div>
      <button class="btn btn--outline btn--md tap" type="button" id="call" style="margin-top:10px"><i data-icon="phone" data-size="16"></i><span>Get code on a call</span></button>
    </div>
    <div class="verified" id="done" hidden>
      <div class="result__circle">VERIFIED</div>
      <p class="result__title" style="margin-top:22px">Number verified</p>
      <p class="result__msg" id="doneMsg">Signing you in…</p>
    </div>
  </section>
</main>

<script src="../assets/js/app.js"></script>
<script>
  (function () {
    const D = window.Deca, $ = D.$, $$ = D.$$;
    const auth = D.store.get('auth') || { via: 'phone', to: D.user.get().phone || '+91 98311 20456', flow: 'login' };
    const flow = D.q('flow') || auth.flow || 'login';
    const CODE = '123456'; let tries = 0; let busy = false;
    $('#to').textContent = auth.to;
    const back = flow === 'signup' ? 'signup.html' : 'login.html';
    $('#edit').href = back; $('.auth-hero__back').href = back;
    if (flow === 'signup') { $('#steps').hidden = false; $('.auth-hero__tag').textContent = 'Verify your number'; }
    if (auth.via === 'email') { $('#call').hidden = true; $('.otp-help b').textContent = 'Not in your inbox?'; $('.otp-help b').nextSibling.textContent = 'Check spam or promotions. It can take up to a minute.'; }
    $('#done .result__circle').innerHTML = D.icon('verified', 72);
    const otp = $('#otp'), status = $('#status'), verify = $('#verify');
    const setStatus = (cls, html) => { status.className = 'otp-status' + (cls ? ' is-' + cls : ''); status.innerHTML = html; };
    otp.addEventListener('input', () => { verify.disabled = otp.value().length < 6; if (status.classList.contains('is-error')) setStatus('', 'The code expires in 10 minutes'); });
    otp.addEventListener('complete', () => check());
    verify.addEventListener('click', () => check());
    $('#demo').addEventListener('click', () => { otp.fill(CODE); });
    $('#call').addEventListener('click', async (e) => { await D.loading(e.currentTarget, 800); D.toast('Calling ' + auth.to + '. Answer to hear your code', { icon: 'phone' }); });
    $('#resend').addEventListener('click', () => { tries = 0; otp.classList.remove('is-error'); setStatus('', 'New code sent. It expires in 10 minutes'); });

    async function check() {
      const code = otp.value(); if (code.length < 6 || busy) return;
      busy = true; setStatus('', '<span class="spin" aria-hidden="true"></span>Verifying…'); verify.classList.add('is-loading');
      await D.wait(900); verify.classList.remove('is-loading'); busy = false;
      if (code !== CODE) {
        tries++; otp.classList.remove('is-error'); void otp.offsetWidth; otp.classList.add('is-error'); D.haptic(40);
        const left = 3 - tries;
        if (left <= 0) { setStatus('error', D.icon('alert', 16) + 'Too many wrong attempts. Tap Resend code to get a new one.'); verify.disabled = true; $$('#otp input').forEach((i) => (i.value = '')); return; }
        setStatus('error', D.icon('alert', 16) + `That code doesn’t match. Check the SMS and try again (${left} ${left === 1 ? 'attempt' : 'attempts'} left).`);
        setTimeout(() => { otp.reset(); verify.disabled = true; }, 500);
        return;
      }
      otp.classList.add('is-ok'); setStatus('ok', D.icon('check-circle', 16) + 'Code verified');
      await D.wait(450);
      let next = 'home.html';
      if (flow === 'signup') {
        const s = D.store.get('signup') || {};
        D.user.set({ name: s.name || 'Aditya Banerjee', first: (s.name || 'Aditya').split(' ')[0], phone: s.phone || auth.to, email: s.email || D.user.get().email, sports: s.sports || [], club: s.club !== false, tier: s.club !== false ? 'Club member' : 'Guest', loggedIn: true });
        D.store.del('signup');
        $('#doneMsg').textContent = 'Account created. One last step: where should we deliver?';
        next = 'location.html';
      } else {
        D.user.set({ loggedIn: true });
        $('#doneMsg').textContent = 'Welcome back, ' + (D.user.get().first || 'Aditya') + '. Taking you to the store…';
      }
      $('#enter').hidden = true; $('#done').hidden = false;
      await D.wait(1300);
      location.href = next;
    }
  })();
</script>
</body>
</html>
