<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decathlon · Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/decathlon.css">
<style>
  .splash { height: 852px; min-height: 852px; cursor: pointer; }
  body:not(.capture) .splash { height: 100vh; min-height: 852px; }
  /* Speed streaks: faint italic slashes echoing the wordmark's slant */
  .streaks { left: 0; top: 0; width: 393px; height: 100%; overflow: hidden; pointer-events: none; }
  .streaks i { position: absolute; width: 2px; height: 220px; border-radius: 2px; background: linear-gradient(180deg, rgba(160,220,250,0), rgba(160,220,250,.28), rgba(160,220,250,0)); transform: skewX(-18deg); }
  body:not(.capture) .streaks i { animation: streak 2.4s var(--ease-out) infinite; }
  @keyframes streak { 0% { transform: translateY(120px) skewX(-18deg); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-160px) skewX(-18deg); opacity: 0; } }
  .sp-glow { left: 50%; top: 280px; width: 440px; height: 300px; margin-left: -220px; border-radius: 50%; background: radial-gradient(closest-side, rgba(120,200,245,.26), rgba(120,200,245,0)); pointer-events: none; }
  .sp-logo { left: 86px; top: 365px; width: 221px; height: 34.4px; color: #fff; }
  .sp-logo svg, .sp-reflect svg { width: 221px; height: 34.4px; }
  .sp-reflect { left: 86px; top: 399.4px; width: 221px; height: 34.4px; color: #fff; transform: scaleY(-1); opacity: .45; filter: blur(.8px); -webkit-mask-image: linear-gradient(0deg, transparent, rgba(0,0,0,.2) 30%, #000); mask-image: linear-gradient(0deg, transparent, rgba(0,0,0,.2) 30%, #000); }
  .sp-tag { left: 0; right: 0; top: 457px; text-align: center; font-size: 15.7px; color: #fff; opacity: .92; }
  .sp-load { left: 146px; top: 720px; width: 100px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; }
  .sp-load i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #fff; }
  body:not(.capture) .sp-load i { animation: load 1.1s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  .sp-foot { left: 0; right: 0; top: 752px; text-align: center; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,.6); }
  body:not(.capture) .sp-logo { animation: sp-in 800ms var(--ease-out) both; }
  body:not(.capture) .sp-reflect { animation: sp-in-r 1000ms 150ms var(--ease-out) both; }
  @keyframes sp-in { from { opacity: 0; transform: scale(.92); letter-spacing: 0; } to { opacity: 1; transform: none; } }
  @keyframes sp-in-r { from { opacity: 0; } to { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .streaks { display: none; } }
</style>
</head>
<body>
<main class="screen bg-welcome splash" id="splash" aria-label="Decathlon is starting" role="button" tabindex="0" data-go="welcome">

    </svg>
  </h1>
  <div class="abs sp-reflect" aria-hidden="true">
    <svg viewBox="0 0 135 21" fill="currentColor">
      <path fill-rule="evenodd" d="M0 .5h8.2C13.2.5 16.4 4.4 16.4 10.5S13.2 20.5 8.2 20.5H0Zm5.2 5v10h2.4c2.2 0 3.6-1.9 3.6-5s-1.4-5-3.6-5Z"/><path d="M16 .5h12.4v4.6h-7.2v3h6.9v4.4h-6.9v3.4h7.3v4.6H16Z"/><path d="M45.6 3.4C43.9 1.4 41.5.3 38.7.3 33.4.3 29.6 4.5 29.6 10.5s3.8 10.2 9.1 10.2c2.8 0 5.2-1.1 6.9-3.1l-3.5-3.5c-.8 1-1.9 1.6-3.2 1.6-2.3 0-3.9-2-3.9-5.2s1.6-5.2 3.9-5.2c1.3 0 2.4.6 3.2 1.6Z"/><path fill-rule="evenodd" d="M50 .5h6v20h-5.2v-4.9h-8.6v-3.2Zm.8 7.2-2.9 4.6h2.9Z"/><path d="M57 .5h12.6v4.6h-3.7v15.4h-5.2V5.1H57Z"/><path d="M71 .5h5v7.6h6V.5h5v20h-5v-7.9h-6v7.9h-5Z"/><path d="M88.2.5h5.4v15h6.4v5H88.2Z"/><path fill-rule="evenodd" d="M107.4.3c5.8 0 10.2 4.4 10.2 10.2s-4.4 10.2-10.2 10.2S97.2 16.3 97.2 10.5 101.6.3 107.4.3Zm0 5c-2.4 0-4.2 2.2-4.2 5.2s1.8 5.2 4.2 5.2 4.2-2.2 4.2-5.2-1.8-5.2-4.2-5.2Z"/><path d="M117.6.5h5.4l6.4 10V.5h5.4v20h-5.2l-6.6-10.3v10.3h-5.4Z"/>
    </svg>
  </div>
  <p class="t sp-tag enter" style="--i:3">Your sports. Your world.</p>
  <div class="abs sp-load" role="progressbar" aria-label="Loading"><i></i></div>
  <p class="t sp-foot">70+ sports · one store</p>
</main>
<script src="../assets/js/app.js"></script>
<script>
  (function () {
    const D = window.Deca;
    // Auto-advance to Welcome (tap anywhere to skip). Frozen in ?capture=1 for screenshots.
    if (!document.body.classList.contains('capture')) setTimeout(() => { location.replace('welcome.html'); }, D.q('fast') ? 300 : 2400);
  })();
</script>
</body>
</html>
