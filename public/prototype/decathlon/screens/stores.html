<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decathlon · Stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/decathlon.css">
<style>
  .loc { margin-top: 18px; }
  .loc .field { height: 44px; gap: 10px; }
  .loc .field > svg { color: var(--muted-2); }
  .loc .affix-btn { display: inline-flex; align-items: center; gap: 4px; }
  .loc .affix-btn svg { width: 16px; height: 16px; }
  .loc .affix-btn.is-busy { color: var(--muted-2); pointer-events: none; }
  .loc .affix-btn.is-busy svg { animation: spin 900ms linear infinite; }
  .seg { margin-top: 14px; }
  .summary { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 10px; font-size: 13px; color: var(--muted-2); }
  .summary b { font-size: 16px; font-weight: 600; color: #000; }
  .scard { position: relative; border-radius: var(--r-tile); background: #fff; box-shadow: inset 0 0 0 1px var(--border); padding: 12px; }
  .scard + .scard { margin-top: 12px; }
  .scard.is-mine { box-shadow: inset 0 0 0 2px var(--navy); }
  .scard__top { display: flex; gap: 12px; }
  .scard .photo { width: 96px; height: 76px; flex-shrink: 0; }
  .scard__name { font-size: 15px; font-weight: 600; color: #000; line-height: 1.3; display: flex; align-items: center; gap: 6px; }
  .scard__meta { font-size: 12px; color: var(--muted-2); margin-top: 2px; line-height: 1.4; }
  .hrs { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; font-weight: 600; }
  .hrs::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .hrs--yes { color: var(--ok); } .hrs--soon { color: var(--warn); } .hrs--no { color: var(--danger); }
  .hrs span { font-weight: 400; color: var(--muted-2); }
  .svc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .svc span { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--surface); color: var(--navy); font-size: 11px; font-weight: 500; }
  .svc svg { width: 13px; height: 13px; color: var(--brand); }
  .scard__acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .scard__acts .btn { height: 34px; font-size: 13px; font-weight: 500; padding: 0 8px; gap: 5px; }
  .scard__acts .btn svg { width: 15px; height: 15px; }
  .mine-tag { height: 18px; padding: 0 6px; border-radius: 9px; background: var(--navy); color: #fff; font-size: 9.5px; font-weight: 600; letter-spacing: .3px; display: inline-flex; align-items: center; }
  .scard__link { position: absolute; inset: 0 0 58px 0; border-radius: var(--r-tile); }
  /* Map view */
  .kmap { position: relative; margin: 14px -24px 0; height: 360px; background: #EAF4F8; overflow: hidden; }
  .kmap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pin { position: absolute; transform: translate(-50%, -100%); display: grid; place-items: center; width: 44px; height: 50px; }
  .pin__b { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--navy); box-shadow: 0 4px 10px rgba(1,42,74,.3); display: grid; place-items: center; transition: background-color 200ms, transform 240ms var(--ease-spring); }
  .pin__b svg { transform: rotate(45deg); color: #fff; width: 16px; height: 16px; }
  .pin.is-sel .pin__b { background: var(--brand); transform: rotate(-45deg) scale(1.18); }
  .pin__lbl { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 10.5px; font-weight: 600; color: var(--navy); background: rgba(255,255,255,.9); padding: 1px 6px; border-radius: 6px; }
  .me { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px rgba(15,150,219,.25), 0 0 0 2px #fff inset; transform: translate(-50%, -50%); }
  .me::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--brand); animation: pulse-ring 2s var(--ease-out) infinite; }
  .map-ctrls { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .map-ctrls .icon-btn { box-shadow: var(--shadow-1); background: #fff; }
  .map-card { margin-top: 12px; }
  .country-note { margin-top: 14px; }
  .segmented button { text-align: center; }
</style>
</head>
<body>
<main class="page" aria-label="Store locator" id="sl" data-delegate>
  <header class="appbar">
    <a class="back tap" href="travel-store.html" data-go="back" aria-label="Back"><svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5 1.5 8.5l7 7"/></svg></a>
    <h1 class="appbar__title">Stores</h1>
    <div class="appbar__icons" id="hdrIcons"></div>
  </header>
  <div class="page-divider"></div>

  <div class="banner banner--info country-note" id="countryNote" hidden><i data-icon="globe" data-size="18"></i><span id="countryTxt"></span></div>

  <form class="fg loc" id="locForm" role="search">
    <label class="label" for="locQ">Find a store</label>
    <div class="field field-affix">
      <i data-icon="search" data-size="18"></i>
      <input id="locQ" type="search" placeholder="City, area or pincode" autocomplete="off" enterkeyhint="search">
      <button class="affix-btn tap" type="button" id="locate" aria-label="Use my current location"><i data-icon="locate" data-size="16"></i><span>Near me</span></button>
    </div>
  </form>

  <div class="segmented seg" id="view" aria-label="View">
    <button type="button" data-value="list" aria-selected="true">List</button>
    <button type="button" data-value="map" aria-selected="false">Map</button>
  </div>

  <p class="summary" id="summary" role="status" aria-live="polite"></p>

  <section id="listView" aria-label="Stores list"></section>

  <section id="mapView" hidden aria-label="Stores map">
    <div class="kmap" id="kmap">
      <svg viewBox="0 0 393 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="393" height="360" fill="#EAF4F8"/>
        <!-- blocks -->
        <g fill="#DDEBF1">
          <rect x="120" y="40" width="70" height="50" rx="6"/><rect x="200" y="30" width="60" height="70" rx="6"/><rect x="270" y="50" width="90" height="60" rx="6"/>
          <rect x="130" y="110" width="60" height="70" rx="6"/><rect x="210" y="120" width="70" height="60" rx="6"/><rect x="295" y="130" width="70" height="70" rx="6"/>
          <rect x="120" y="200" width="80" height="60" rx="6"/><rect x="215" y="205" width="60" height="70" rx="6"/><rect x="290" y="225" width="80" height="60" rx="6"/>
          <rect x="130" y="285" width="70" height="55" rx="6"/><rect x="225" y="295" width="60" height="50" rx="6"/>
        </g>
        <!-- East Kolkata wetlands + lakes -->
        <path d="M250 240c20-8 44-4 58 10s8 34-14 38-50-2-58-18 0-26 14-30Z" fill="#CFE8C8"/>
        <ellipse cx="160" cy="258" rx="22" ry="10" fill="#B9DDF0"/>
        <ellipse cx="238" cy="96" rx="14" ry="9" fill="#B9DDF0"/>
        <!-- Hooghly river -->
        <path d="M58 -10C70 40 40 80 62 130s-6 90 10 140 30 70 18 110" fill="none" stroke="#9CCFE8" stroke-width="26" stroke-linecap="round"/>
        <!-- roads -->
        <g fill="none" stroke="#fff" stroke-linecap="round">
          <path d="M80 60 380 70" stroke-width="7"/><path d="M78 175H393" stroke-width="7"/><path d="M92 300 393 260" stroke-width="7"/>
          <path d="M200 0V360" stroke-width="6"/><path d="M285 0 300 360" stroke-width="6"/><path d="M110 0l40 360" stroke-width="5"/>
          <path d="M200 175 330 40" stroke-width="5"/>
        </g>
        <g fill="#6B8FA3" font-family="Poppins, sans-serif" font-size="9" font-weight="500" letter-spacing=".6">
          <text x="18" y="200" transform="rotate(-78 18 200)">HOOGHLY</text>
          <text x="316" y="36">NEW TOWN</text><text x="222" y="152">SALT LAKE</text><text x="120" y="232">PARK STREET</text><text x="232" y="340">KASBA</text>
        </g>
      </svg>
      <div id="pins"></div>
      <div class="map-ctrls"><button class="icon-btn tap" type="button" id="recenter" aria-label="Centre on my location"><i data-icon="locate" data-size="20"></i></button></div>
    </div>
    <div class="map-card" id="mapCard"></div>
  </section>

  <nav data-tabbar="travel"></nav>
</main>

<section class="sheet" id="dirSheet" aria-labelledby="dirT">
  <div class="sheet__head">
    <div><p class="sheet__title" id="dirT">Directions</p><p class="sheet__sub" id="dirSub"></p></div>
    <button class="sheet__close tap" type="button" data-close aria-label="Close"><i data-icon="close" data-size="14" data-sw="2.2"></i></button>
  </div>
  <div class="options" id="dirOpts">
    <button class="option tap" type="button" data-app="Google Maps"><span class="icon-tile" style="width:36px;height:36px"><i data-icon="navigate" data-size="18"></i></span><span class="option__body"><span class="option__title">Google Maps</span><span class="option__sub" id="dirEta">18 min by car</span></span><i data-icon="chevron" data-size="18"></i></button>
    <button class="option tap" type="button" data-app="Apple Maps"><span class="icon-tile" style="width:36px;height:36px"><i data-icon="pin" data-size="18"></i></span><span class="option__body"><span class="option__title">Apple Maps</span><span class="option__sub">Walking, driving and transit</span></span><i data-icon="chevron" data-size="18"></i></button>
    <button class="option tap" type="button" id="dirCopy"><span class="icon-tile" style="width:36px;height:36px"><i data-icon="copy" data-size="18"></i></span><span class="option__body"><span class="option__title">Copy address</span><span class="option__sub" id="dirAddr"></span></span></button>
  </div>
</section>

<script src="../assets/js/app.js"></script>
<script>
  (function () {
    const D = window.Deca, $ = D.$, $$ = D.$$;
    $('#hdrIcons').innerHTML = D.headIcons('#fff');

    /* Store extras shared with store-detail.html */
    const EXTRA = {
      saltlake: { services: ['collect', 'workshop', 'returns', 'try'], pos: [236, 138], mins: 22, area: 'salt lake sector v bidhannagar 700091' },
      shakespeare: { services: ['collect', 'returns'], pos: [150, 196], mins: 41, area: 'park street shakespeare sarani central 700017' },
      newtown: { services: ['collect', 'workshop', 'returns', 'try'], pos: [322, 78], mins: 6, area: 'new town newtown rajarhat action area 700135 700156' },
      acropolis: { services: ['collect', 'returns', 'try'], pos: [258, 300], mins: 35, area: 'kasba acropolis mall rajdanga 700107' },
    };
    const SVC = { collect: ['Click & collect', 'bag'], workshop: ['Workshop', 'settings'], returns: ['Returns', 'return'], try: ['Try sports', 'run'] };
    const parseT = (t) => { const m = t.trim().match(/(\d+):(\d+)\s*(AM|PM)/i); let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12; return h * 60 + +m[2]; };
    function status(s) { const x = D.storeStatus(s); return [x.k, x.label, x.sub]; }
    const km = (s) => parseFloat(s.distance);

    /* State */
    let view = 'list', sel = null, sorted = D.stores.slice().sort((x, y) => km(x) - km(y));
    const mine = () => D.store.get('myStore', null);
    const country = D.q('country');
    if (country && country !== 'India') { $('#countryNote').hidden = false; $('#countryTxt').innerHTML = `<b>Stores in ${D.esc(country)}</b> will show here once you arrive. Until then, here are your stores in Kolkata. Your Club card works worldwide.`; }

    function card(s, compact) {
      const [k, lbl, sub] = status(s); const ex = EXTRA[s.id] || { services: [] }; const isMine = mine() === s.id;
      return `<article class="scard${isMine ? ' is-mine' : ''}" data-store="${s.id}">
        <a class="scard__link" href="store-detail.html?id=${s.id}" aria-label="${D.esc(s.full)} details"></a>
        <div class="scard__top">
          <span class="photo"><img src="${D.img(s.img)}" alt="" loading="lazy"></span>
          <div class="grow">
            <p class="scard__name">${D.esc(s.name)}${isMine ? '<span class="mine-tag">MY STORE</span>' : ''}</p>
            <p class="scard__meta"><span class="num">${s.distance}</span> · ${D.esc(s.address.split(',').slice(0, 2).join(','))}</p>
            <p class="hrs hrs--${k}">${lbl} <span>· ${sub}</span></p>
          </div>
        </div>
        ${compact ? '' : `<div class="svc">${ex.services.map((v) => `<span>${D.icon(SVC[v][1], 13)}${SVC[v][0]}</span>`).join('')}</div>`}
        <div class="scard__acts">
          <button class="btn btn--outline tap" type="button" data-dir="${s.id}">${D.icon('navigate', 15)}<span>Directions</span></button>
          <button class="btn btn--outline tap" type="button" data-call="${s.id}">${D.icon('phone', 15)}<span>Call</span></button>
          <a class="btn btn--primary tap" href="store-detail.html?id=${s.id}"><span>Details</span></a>
        </div>
      </article>`;
    }

    function filtered() {
      const s = $('#locQ').value.trim().toLowerCase(); if (!s) return sorted;
      return sorted.filter((x) => `${x.name} ${x.full} ${x.address} ${(EXTRA[x.id] || {}).area}`.toLowerCase().includes(s) || (/^kol/.test(s)));
    }
    function render() {
      const list = filtered(); const q = $('#locQ').value.trim();
      $('#summary').innerHTML = list.length ? `<span><b class="num">${list.length}</b> ${list.length === 1 ? 'store' : 'stores'} ${q ? `for “${D.esc(q)}”` : 'in Kolkata'}</span><span>Nearest first</span>` : '';
      $('#listView').innerHTML = list.length ? list.map((s) => card(s)).join('') : `<div class="empty-state" role="status"><div class="empty-state__icon">${D.icon('store', 40)}</div><h3>No stores match “${D.esc(q)}”</h3><p>We have 4 stores in Kolkata. Try an area like Salt Lake or New Town, or a pincode such as 700135.</p><button class="btn btn--primary btn--md tap" type="button" id="showAll">Show all Kolkata stores</button></div>`;
      const sa = $('#showAll'); if (sa) sa.onclick = () => { $('#locQ').value = ''; render(); };
      renderPins(list);
      D.hydrate($('#sl'));
    }
    function renderPins(list) {
      $('#pins').innerHTML = `<span class="me" style="left:${(292 / 393) * 100}%;top:${(118 / 360) * 100}%" aria-hidden="true"></span>` + list.map((s) => { const p = (EXTRA[s.id] || { pos: [200, 180] }).pos; return `<button class="pin tap${sel === s.id ? ' is-sel' : ''}" type="button" data-pin="${s.id}" style="left:${(p[0] / 393) * 100}%;top:${(p[1] / 360) * 100}%" aria-label="${D.esc(s.full)}, ${s.distance}"><span class="pin__b">${D.icon('store', 16, { sw: 2 })}</span><span class="pin__lbl">${D.esc(s.name.replace(' Kasba Connect', ''))}</span></button>`; }).join('');
      const cur = list.find((s) => s.id === sel) || list[0];
      $('#mapCard').innerHTML = cur ? card(cur, true) : `<p class="summary">No stores to show on the map.</p>`;
      if (cur && !sel) { sel = cur.id; const b = $(`[data-pin="${cur.id}"]`); b && b.classList.add('is-sel'); }
    }

    /* Events */
    const setView = (v) => { view = v; $('#listView').hidden = view !== 'list'; $('#mapView').hidden = view !== 'map'; $$('#view button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.value === v))); };
    $('#view').addEventListener('change', (e) => { setView(e.detail); D.haptic(6); });
    $('#pins').addEventListener('click', (e) => { const b = e.target.closest('[data-pin]'); if (!b) return; sel = b.dataset.pin; renderPins(filtered()); D.hydrate($('#mapCard')); });
    $('#recenter').addEventListener('click', () => { sel = sorted[0].id; renderPins(filtered()); D.hydrate($('#mapCard')); D.toast('Centred on New Town · you are here', { icon: 'locate' }); });
    $('#locQ').addEventListener('input', render);
    $('#locForm').addEventListener('submit', (e) => { e.preventDefault(); $('#locQ').blur(); render(); });
    $('#locate').addEventListener('click', async (e) => {
      const b = e.currentTarget; b.classList.add('is-busy'); b.querySelector('span').textContent = 'Locating…';
      await D.wait(1000); b.classList.remove('is-busy'); b.querySelector('span').textContent = 'Near me';
      $('#locQ').value = ''; sorted = D.stores.slice().sort((x, y) => km(x) - km(y)); render();
      D.toast('Showing stores near New Town, Kolkata 700135', { icon: 'locate' });
    });

    // Directions + call (delegated: list + map card)
    let dirStore = null;
    document.addEventListener('click', async (e) => {
      const d = e.target.closest('[data-dir]'); const c = e.target.closest('[data-call]');
      if (d) { e.preventDefault(); dirStore = D.storeById(d.dataset.dir); $('#dirT').textContent = `Directions to ${dirStore.name}`; $('#dirSub').textContent = `${dirStore.distance} from you`; $('#dirEta').textContent = `${(EXTRA[dirStore.id] || {}).mins || 15} min by car · ${dirStore.distance}`; $('#dirAddr').textContent = dirStore.address; D.sheet.open('dirSheet'); }
      if (c) {
        e.preventDefault(); const s = D.storeById(c.dataset.call);
        if (await D.dialog({ title: `Call ${s.full}?`, message: `${s.phone} · ${status(s)[1].toLowerCase()}, ${status(s)[2]}`, confirm: 'Call', tone: 'info', icon: 'phone' })) D.toast(`Calling ${s.phone}…`, { icon: 'phone' });
      }
    });
    $$('#dirOpts [data-app]').forEach((b) => b.addEventListener('click', async () => { D.sheet.close(); D.toast(`Opening ${b.dataset.app} for ${dirStore.name}…`, { icon: 'navigate' }); }));
    $('#dirCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(dirStore.address); } catch (x) {} D.sheet.close(); D.toast('Address copied', { icon: 'copy' }); });

    if (D.q('view') === 'map') setView('map');
    render();
  })();
</script>
</body>
</html>
