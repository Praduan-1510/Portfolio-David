<style>
  /* Pixel-matched to Travel Store.png: title y165, world map y205..388 (Robinson, navy land,
     #0F96DB store countries, white glow), "Stores in Kolkata" y424, 160x76 store photos at
     x14/221 y460/572 with 13px labels, promo banner x14..379 from y694. */
  .ts { background: linear-gradient(180deg, #A0D5F1 0px, #C6E6F7 160px, #FFFFFF 400px, #B2DDF3 770px, #B2DDF3 100%); min-height: 940px; }
  .map { left: 0; top: 200px; width: 393px; height: 192px; }
  .map svg { display: block; width: 393px; height: 192px; overflow: visible; }
  .map .land path { fill: #012A4A; stroke: rgba(255,255,255,.55); stroke-width: .3; stroke-linejoin: round; cursor: pointer; transition: fill 160ms; }
  .map .land path.on { fill: #0F96DB; }
  .map .land path:hover { fill: #1B3F5E; }
  .map .land path.on:hover { fill: #2AA6E6; }
  .map .land path.sel { fill: #7FD3FF; }
  .map .land path:focus { outline: none; }
  .map .land path:focus-visible { stroke: #FBD7B1; stroke-width: 1.2; }
  .map .pulse { fill: none; stroke: #0F96DB; stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: pin-ring 2.2s var(--ease-out) infinite; }
  .map .you { fill: #FBD7B1; stroke: #012A4A; stroke-width: 1.2; }
  @keyframes pin-ring { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
  .see { left: 318px; top: 419px; height: 26px; padding: 0 6px; display: flex; align-items: center; font-size: 13px; color: #000; border-radius: 6px; }
  .see::after { content: ''; position: absolute; inset: -9px -4px; }
  .st { width: 160px; }
  .st .photo { height: 76px; box-shadow: 0 1px 2px rgba(1,42,74,.08); }
  .st .photo img { transition: transform 500ms var(--ease-out); }
  .st:active .photo img { transform: scale(1.04); }
  .st__label { position: absolute; left: 1px; top: 84px; font-size: 13px; line-height: 1; color: #000; white-space: nowrap; }
  .st__near { position: absolute; left: 6px; top: 6px; height: 18px; padding: 0 6px; border-radius: 9px; background: rgba(1,42,74,.82); color: #fff; font-size: 9.5px; font-weight: 600; letter-spacing: .3px; display: inline-flex; align-items: center; gap: 3px; }
  .st__near svg { width: 10px; height: 10px; }
  .promo { left: 14px; top: 694px; width: 365px; height: 150px; border-radius: 10px; overflow: hidden; background: linear-gradient(120deg, #012A4A, #0F96DB); }
  .promo img { width: 100%; height: 100%; object-fit: cover; }
  .promo::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(1,42,74,.86) 0%, rgba(1,42,74,.55) 48%, rgba(1,42,74,0) 78%); }
  .promo__txt { position: absolute; z-index: 2; left: 16px; top: 18px; color: #fff; }
  .promo__eyebrow { display: block; font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: #FBD7B1; }
  .promo__title { display: block; font-size: 20px; font-weight: 700; line-height: 1.1; margin-top: 4px; }
  .promo__title b { display: block; font-size: 30px; color: #fff; }
  .promo__cta { position: absolute; z-index: 2; left: 16px; bottom: 14px; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 11px; border-radius: var(--r); background: #fff; color: var(--navy); font-size: 12.5px; font-weight: 600; }
  .promo__cta svg { width: 13px; height: 13px; }
  /* Country sheet */
  .cstat { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .cstat div { background: var(--surface); border-radius: var(--r); padding: 12px 10px; text-align: center; }
  .cstat b { display: block; font-size: 20px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .cstat span { font-size: 11px; color: var(--muted-2); }
  .ccities { margin-top: 14px; }
  .ccities .kvs > div { padding: 8px 0; }
</style>

<section class="sheet" id="countrySheet" aria-labelledby="cT">
  <div class="sheet__head">
    <div><p class="sheet__title" id="cT">Decathlon in India</p><p class="sheet__sub" id="cSub">126 stores · open today</p></div>
    <button class="sheet__close tap" type="button" data-close aria-label="Close"><i data-icon="close" data-size="14" data-sw="2.2"></i></button>
  </div>
  <div class="cstat"><div><b class="num" id="cStores">126</b><span>stores</span></div><div><b class="num" id="cCities">38</b><span>cities</span></div><div><b class="num" id="cSports">70+</b><span>sports</span></div></div>
  <div class="ccities"><p class="label-caps" style="margin-bottom:4px">Biggest cities</p><div class="kvs kvs--sm kvs--plain" id="cList"></div></div>
  <div class="banner banner--info" style="margin-top:14px" id="cNote"><i data-icon="info" data-size="18"></i><span id="cNoteTxt">Your Club card works in every Decathlon store worldwide.</span></div>
  <div class="sheet__foot">
    <button class="btn btn--primary btn--lg tap" type="button" id="cGo"><span>Find stores near me</span></button>
    <button class="btn btn--outline btn--lg tap" type="button" id="cSave"><span>Save for my trip</span></button>
  </div>
</section>

<script src="../assets/js/app.js"></script>
<script>
  (function () {
    const D = window.Deca, $ = D.$, $$ = D.$$;

    // Kolkata store tiles (2 x 2) -> store detail
    const POS = [[14, 460], [221, 460], [14, 572], [221, 572]];
    const nearest = D.stores.slice().sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance))[0].id;
    const mine = D.store.get('myStore', null);
    $('#stores').innerHTML = D.stores.map((s, i) => `<a class="abs st tap enter" href="store-detail.html?id=${s.id}" style="left:${POS[i][0]}px;top:${POS[i][1]}px;--i:${i < 2 ? 2 : 3}" aria-label="${D.esc(s.full)}, ${s.distance} away">
        <span class="photo"><img src="${D.img(s.img)}" alt="" loading="lazy"></span>
        ${s.id === mine ? `<span class="st__near">${D.icon('check', 10, { sw: 2.6 })}MY STORE</span>` : ''}
        <span class="st__label">${D.esc(s.name)}</span></a>`).join('');

    // Country data for the sheet
    const CITIES = {
      India: [['Bengaluru', 19], ['Delhi NCR', 17], ['Mumbai', 14], ['Pune', 9], ['Kolkata', 4]],
      France: [['Paris region', 58], ['Lyon', 16], ['Lille', 14], ['Marseille', 12]],
      Spain: [['Madrid', 31], ['Barcelona', 28], ['Valencia', 12]],
      China: [['Shanghai', 34], ['Beijing', 27], ['Shenzhen', 22]],
      Italy: [['Milan', 24], ['Rome', 18], ['Turin', 9]],
      Germany: [['Berlin', 11], ['Munich', 9], ['Hamburg', 8]],
      USA: [['San Francisco Bay', 6], ['New York', 4]],
      Brazil: [['São Paulo', 14], ['Rio de Janeiro', 6]],
      'United Kingdom': [['London', 12], ['Manchester', 4]],
      Australia: [['Melbourne', 6], ['Sydney', 5]],
    };
    let current = null;
    const saved = () => D.store.get('tripCountries', []);
    const paintSave = () => { const on = saved().includes(current); $('#cSave span').textContent = on ? 'Saved for my trip' : 'Save for my trip'; $('#cSave').classList.toggle('is-done', on); };
    function openCountry(path) {
      const name = path.dataset.name, n = +path.dataset.n;
      $$('#land path.sel').forEach((p) => p.classList.remove('sel')); path.classList.add('sel');
      current = name;
      $('#cT').textContent = `Decathlon in ${name}`;
      $('#cSub').textContent = `${n} ${n === 1 ? 'store' : 'stores'} · open today`;
      $('#cStores').textContent = D.fmtNum(n);
      const cities = CITIES[name] || null;
      $('#cCities').textContent = Math.max(1, Math.round(n / (name === 'France' ? 3.3 : 3.1)));
      $('#cSports').textContent = n > 50 ? '80+' : n > 10 ? '70+' : '60+';
      $('#cList').innerHTML = (cities || [['Capital region', Math.ceil(n * 0.4)], ['Other cities', n - Math.ceil(n * 0.4)]]).map(([c, k]) => `<div><span class="k">${c}</span><span class="v num">${k} ${k === 1 ? 'store' : 'stores'}</span></div>`).join('');
      const india = name === 'India';
      $('#cNoteTxt').textContent = india ? 'New Town is your nearest store, 1.4 km away. Reserve online and pick up in 2 hours.' : `Travelling to ${name}? Your Club card and points work in every Decathlon store worldwide.`;
      $('#cGo span').textContent = india ? 'Find stores near me' : 'See store hours & services';
      paintSave();
      D.sheet.open('countrySheet');
    }
    $('#countrySheet').addEventListener('sheet:close', () => $$('#land path.sel').forEach((p) => p.classList.remove('sel')));
    $('#cGo').addEventListener('click', async (e) => {
      if (current === 'India') { location.href = 'stores.html'; return; }
      await D.loading(e.currentTarget, 700); D.sheet.close();
      D.toast(`Opening stores in ${current}`, { icon: 'globe' }); setTimeout(() => (location.href = 'stores.html?country=' + encodeURIComponent(current)), 700);
    });
    $('#cSave').addEventListener('click', () => {
      const s = saved(); const on = s.includes(current);
      D.store.set('tripCountries', on ? s.filter((x) => x !== current) : s.concat(current)); paintSave(); D.haptic(10);
      D.toast(on ? `${current} removed from your trip` : `${current} saved · we’ll show local stores when you land`, { icon: on ? 'close' : 'check' });
    });

    // Map interactions
    const land = $('#land');
    $$('path.on', land).forEach((p) => { p.setAttribute('tabindex', '0'); p.setAttribute('role', 'button'); p.setAttribute('aria-label', `${p.dataset.name}: ${p.dataset.n} stores`); });
    land.addEventListener('click', (e) => {
      const p = e.target.closest('path'); if (!p) return;
      if (p.classList.contains('on')) openCountry(p);
      else D.toast(`No Decathlon stores in ${p.dataset.name} yet`, { icon: 'globe' });
    });
    land.addEventListener('keydown', (e) => { const p = e.target.closest('path.on'); if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openCountry(p); } });

    // Deep link for captures: ?country=India
    if (D.q('country')) { const p = $$('path.on', land).find((x) => x.dataset.name === D.q('country')); if (p) setTimeout(() => openCountry(p), 50); }
    D.hydrate($('#ts'));
  })();
</script>
