<style>
  /* Pixel-matched to Welcome.png (393 x 852). Logo 86..307 x 365..399,
     reflection below, tagline cap-top 459, CTAs 280 wide at x56. */
  .welcome { height: 852px; min-height: 852px; }
  body:not(.capture) .welcome { height: 100vh; min-height: 852px; }
  .wl-logo { left: 86px; top: 365px; width: 221px; height: 34.4px; color: #fff; }
  .wl-logo svg { width: 221px; height: 34.4px; }
  .wl-reflect { left: 86px; top: 399.4px; width: 221px; height: 34.4px; color: #fff; transform: scaleY(-1); opacity: .5; filter: blur(.6px);
    -webkit-mask-image: linear-gradient(0deg, transparent 0%, rgba(0,0,0,.2) 30%, #000 100%); mask-image: linear-gradient(0deg, transparent 0%, rgba(0,0,0,.2) 30%, #000 100%); pointer-events: none; }
  .wl-reflect svg { width: 221px; height: 34.4px; }
  .wl-tag { left: 0; right: 0; top: 456.6px; text-align: center; font-size: 15.7px; color: #fff; letter-spacing: 0; }
  .wl-cta { left: 56px; width: 280px; font-size: 19.6px; font-weight: 600; }
  .wl-get { top: 682px; height: 32px; padding-top: 2px; }
  .wl-sign { top: 728px; height: 34px; }
  .wl-glow { left: 50%; top: 300px; width: 420px; height: 260px; margin-left: -210px; border-radius: 50%; background: radial-gradient(closest-side, rgba(120,200,245,.18), rgba(120,200,245,0)); pointer-events: none; }
  body:not(.capture) .wl-logo { animation: wl-in 700ms var(--ease-out) both; }
  body:not(.capture) .wl-reflect { animation: wl-in-r 900ms 120ms var(--ease-out) both; }
  @keyframes wl-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes wl-in-r { from { opacity: 0; } to { opacity: .5; } }
</style>
