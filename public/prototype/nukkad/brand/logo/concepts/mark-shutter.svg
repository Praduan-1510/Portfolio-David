  <path d="M22 86V74a28 28 0 0 1 56 0v12Z" fill="#F7B32B" />
  <g fill="#FBF9F5">
    <rect x="18" y="16" width="64" height="7" rx="3.5" />
    <rect x="18" y="27" width="64" height="7" rx="3.5" />
    <rect x="18" y="38" width="64" height="7" rx="3.5" />
  </g>
  <circle cx="50" cy="72" r="4.5" fill="#0B7C76" />
</svg>
