<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nukkad — The Turn">
  <title>Nukkad — The Turn</title>
  <!--
    A lowercase 'n' drawn as a single road that turns a corner. The right leg stops short and a
    dot completes it: the destination, just around the corner. The gap between them is half a
    stroke wide - that gap is the last minute of the delivery.
    The arch's negative space reads as a doorway, which is the shop.
  -->
  <g fill="none" stroke="#0B7C76" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 79V41a20 20 0 0 1 40 0v8" />
  </g>
  <circle cx="70" cy="77" r="9" fill="#0B7C76" />
</svg>
