<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spendee · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kodchasan:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/spendee.css">
</head>
<body>
<main class="screen" style="height:874px;min-height:874px" aria-label="Sign in">
  <div class="abs enter" style="left:44px;top:52px;display:flex;align-items:center;gap:10px;--i:0">
    <div class="brand-tile" aria-hidden="true">
      <svg width="60" height="60" viewBox="0 0 110 110">
        <defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ef25a"/><stop offset=".45" stop-color="#d9e46a"/><stop offset=".7" stop-color="#e3d27a"/><stop offset="1" stop-color="#8ec8f0"/></linearGradient></defs>
        <path d="M74.5 51.5C76 37 65 27 54 27C42.5 27 36 33.5 36 41.5C36 50 44.5 53.2 54 56C64 59 71.5 62.8 71.5 71C71.5 79 63.5 83 53 83C41 83 31.5 75 31.5 63" fill="none" stroke="#e9cf73" stroke-width="4.4" stroke-linecap="round"/>
        <path d="M63.8 12.5L36.2 97" stroke="url(#bar)" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M72.8 14.5L45.2 99" stroke="url(#bar)" stroke-width="3.6" stroke-linecap="round"/>
      </svg>
    </div>
    <span style="font-size:25px;letter-spacing:.4px;margin-top:-2px">Spendee</span>
  </div>

  <p class="abs enter" style="left:44px;top:199px;font-size:14px;letter-spacing:.9px;color:#e6e6e6;--i:1">Welcome Back</p>
  <h1 class="abs enter" style="left:44px;top:224px;font-size:38.5px;font-weight:700;letter-spacing:.2px;line-height:50px;--i:1">Sign In</h1>

  <form id="signin" action="dashboard.html" autocomplete="on" novalidate>
    <label class="abs label enter" for="mobile" style="left:60px;top:326px;--i:2">Mobile Number</label>
    <div class="abs field field-tel enter" style="left:50px;top:360px;width:302px;font-size:15px;font-weight:500;padding-left:22px;--i:2">
      <span>+91</span><span style="margin:0 22px 0 22px;font-weight:400">|</span>
      <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" value="98765 43210" aria-label="Mobile number">
    </div>

    <label class="abs label enter" for="pin" style="left:60px;top:446px;--i:3">4 - Digit PIN</label>
    <div class="abs pin enter" id="pinBox" style="left:78px;top:479px;--i:3">
      <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" value="12" aria-label="4 digit PIN">
      <div class="pin__cell filled"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2c.4 0 .8.2 1 .6l2.5 5.1 5.6.8c.9.1 1.3 1.2.6 1.9l-4.1 4 1 5.6c.2.9-.8 1.6-1.6 1.2L12 18.7l-5 2.7c-.8.4-1.8-.3-1.6-1.2l1-5.6-4.1-4c-.7-.7-.3-1.8.6-1.9l5.6-.8L11 2.8c.2-.4.6-.6 1-.6Z"/></svg></div>
      <div class="pin__cell filled"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2c.4 0 .8.2 1 .6l2.5 5.1 5.6.8c.9.1 1.3 1.2.6 1.9l-4.1 4 1 5.6c.2.9-.8 1.6-1.6 1.2L12 18.7l-5 2.7c-.8.4-1.8-.3-1.6-1.2l1-5.6-4.1-4c-.7-.7-.3-1.8.6-1.9l5.6-.8L11 2.8c.2-.4.6-.6 1-.6Z"/></svg></div>
      <div class="pin__cell"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2c.4 0 .8.2 1 .6l2.5 5.1 5.6.8c.9.1 1.3 1.2.6 1.9l-4.1 4 1 5.6c.2.9-.8 1.6-1.6 1.2L12 18.7l-5 2.7c-.8.4-1.8-.3-1.6-1.2l1-5.6-4.1-4c-.7-.7-.3-1.8.6-1.9l5.6-.8L11 2.8c.2-.4.6-.6 1-.6Z"/></svg></div>
      <div class="pin__cell"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2c.4 0 .8.2 1 .6l2.5 5.1 5.6.8c.9.1 1.3 1.2.6 1.9l-4.1 4 1 5.6c.2.9-.8 1.6-1.6 1.2L12 18.7l-5 2.7c-.8.4-1.8-.3-1.6-1.2l1-5.6-4.1-4c-.7-.7-.3-1.8.6-1.9l5.6-.8L11 2.8c.2-.4.6-.6 1-.6Z"/></svg></div>
    </div>

    <button type="submit" class="abs btn btn--primary tap enter" style="left:34px;top:583px;width:334px;gap:10px;--i:4">
      Sign In
      <svg width="22" height="18" viewBox="0 0 22 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9h18.5M12.5 1.5 20 9l-7.5 7.5"/></svg>
    </button>
  </form>

  <p class="abs enter" style="left:0;right:0;top:655px;text-align:center;font-size:15px;letter-spacing:.6px;color:#cfcfcf;--i:5">Forgot PIN? <a class="link-green tap" href="forgot-pin.html">Reset via OTP</a></p>

  <a class="abs social tap enter" href="dashboard.html" data-sheet="googleSheet" aria-haspopup="dialog" style="left:34px;top:701px;width:135px;--i:6">
    <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
    Google
  </a>
  <a class="abs social tap enter" href="dashboard.html" data-biometric aria-haspopup="dialog" style="left:208px;top:701px;width:160px;--i:6">
    <svg width="22" height="24" viewBox="0 0 24 26" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5.2A10 10 0 0 1 19 5.2"/><path d="M3 9.5a10 10 0 0 1 18 0"/><path d="M4.5 17.5C4 15.8 4 14 4.5 12.5A7.8 7.8 0 0 1 19.5 12.5c.3 1.2.4 2.5.2 3.8"/><path d="M8 22c-1.3-2-2-4.3-1.7-6.7A5.7 5.7 0 0 1 17.7 15c.2 1.8.1 3.6-.4 5.3"/><path d="M11.2 23.5C9.6 21.3 9 18.6 9.3 16a2.7 2.7 0 0 1 5.4.2c.2 2-.1 3.9-.8 5.8"/><path d="M12 16c.1 2.7-.4 5.2-1.5 7.3M16.6 22.6c.3-.6.5-1.2.7-1.9"/></svg>
    Biometrics
  </a>

  <p class="abs enter" style="left:0;right:0;top:773px;text-align:center;font-size:15px;letter-spacing:.7px;color:#cfcfcf;--i:7">New to Spendee? <a class="link-green tap" href="signup.html">Create Account</a></p>
</main>
<section class="sheet" id="googleSheet" aria-labelledby="gTitle">
  <div class="sheet__head">
    <div class="row-flex" style="gap:12px">
      <span style="width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;flex-shrink:0"><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg></span>
      <div><p class="sheet__title" id="gTitle">Choose an account</p><p class="sheet__sub" id="gSub">to continue to Spendee</p></div>
    </div>
    <button class="sheet__close tap" data-close aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m1 1 10 10M11 1 1 11"/></svg></button>
  </div>

  <div id="gChoose">
    <div class="options">
      <button class="option tap g-acct" id="gJayanta" type="button">
        <img src="../assets/img/avatar.png" alt="" width="40" height="40" style="border-radius:50%;flex-shrink:0">
        <span class="option__body"><span class="option__title">Jayanta Adhikari</span><span class="option__sub">jayanta.adhikari@example.com</span></span>
        <span class="g-spin" aria-hidden="true"></span>
        <svg class="g-chev" width="9" height="15" viewBox="0 0 10 17" fill="none" stroke="#5fb2f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 7 7-7 7"/></svg>
      </button>
      <button class="option tap" id="gOther" type="button">
        <span class="menu__icon icon-gray" style="width:40px;height:40px;border-radius:50%"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M2.5 21a7.5 7.5 0 0 1 12.5-5.6M19 14v6M16 17h6"/></svg></span>
        <span class="option__body"><span class="option__title">Use another account</span><span class="option__sub">Sign in with a different Google account</span></span>
      </button>
    </div>
  </div>

  <form id="gOtherForm" hidden novalidate>
    <div class="fg">
      <label class="label" for="gEmail">Email or phone</label>
      <input class="field" id="gEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@business.com" data-validate="required|email">
    </div>
    <div class="btn-pair" style="margin-top:20px">
      <button class="btn btn--neutral tap" type="button" id="gBack"><span>Back</span></button>
      <button class="btn btn--primary tap" type="submit" id="gNext"><span>Next</span></button>
    </div>
  </form>

  <p style="font-size:12px;color:#8a8a8a;line-height:1.5;margin-top:18px">To continue, Google will share your name, email address and profile picture with Spendee. See Spendee's <a class="c-blue tap" href="help.html">Privacy Policy</a>.</p>
</section>

<style>
  .g-spin { display: none; width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgba(95,178,241,.25); border-top-color: #5fb2f1; animation: spin 700ms linear infinite; flex-shrink: 0; }
  .g-acct.is-loading .g-spin { display: block; }
  .g-acct.is-loading .g-chev { display: none; }
  .g-acct.is-loading { pointer-events: none; box-shadow: inset 0 0 0 2px #5fb2f1; background: #1c2a36; }
  #pinBox.is-error .pin__cell:not(.filled) { box-shadow: inset 0 0 0 2px #f15858; }
  #pinBox.is-shake { animation: shake 360ms; }
  .pin-err { position: absolute; left: 78px; top: 541px; font-size: 12.5px; line-height: 16px; letter-spacing: .3px; color: #f15858; display: none; align-items: center; gap: 6px; }
  .pin-err.show { display: flex; }
  .btn.is-loading > svg { visibility: hidden; }
  body.capture .dialog-wrap { right: auto; width: 402px; }
  /* Face ID HUD */
  .faceid { width: 270px; padding: 30px 22px 18px; }
  .faceid__glyph { position: relative; width: 96px; height: 96px; margin: 0 auto 18px; color: #5fb2f1; display: grid; place-items: center; }
  .faceid__glyph svg { transition: opacity 220ms var(--ease-out), transform 300ms var(--ease-spring); }
  .faceid__scan { position: absolute; left: 10px; right: 10px; top: 12px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(95,178,241,0), #5fb2f1, rgba(95,178,241,0)); box-shadow: 0 0 12px rgba(95,178,241,.9); animation: faceScan 1100ms var(--ease-out) infinite alternate; }
  @keyframes faceScan { to { top: 82px; } }
  .faceid__face { animation: facePulse 1100ms ease-in-out infinite alternate; }
  @keyframes facePulse { to { opacity: .55; } }
  .faceid__ok { position: absolute; inset: 8px; border-radius: 50%; background: #314528; color: #8df15e; display: grid; place-items: center; opacity: 0; transform: scale(.6); transition: opacity 240ms var(--ease-out), transform 360ms var(--ease-spring); }
  .faceid__ok path { stroke-dasharray: 60; stroke-dashoffset: 60; }
  .faceid.is-ok .faceid__ok { opacity: 1; transform: none; }
  .faceid.is-ok .faceid__ok path { animation: draw 460ms 120ms var(--ease-out) forwards; }
  .faceid.is-ok .faceid__face, .faceid.is-ok .faceid__scan { opacity: 0; animation: none; }
  .faceid.is-ok .dialog__actions { visibility: hidden; }
</style>
<script src="../assets/js/app.js"></script>
<script>
  (function () {
    const input = document.getElementById('pin');
    const box = document.getElementById('pinBox');
    const cells = box.querySelectorAll('.pin__cell');
    const render = () => cells.forEach((c, i) => {
      c.classList.toggle('filled', i < input.value.length);
      c.classList.toggle('cursor', document.activeElement === input && i === Math.min(input.value.length, 3));
    });
    box.addEventListener('click', () => { input.focus(); const n = input.value.length; try { input.setSelectionRange(n, n); } catch (e) {} });
    input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').slice(0, 4); render(); });
    input.addEventListener('focus', render); input.addEventListener('blur', render);
  })();
</script>
<script>
  (function () {
    const form = document.getElementById('signin');
    const input = document.getElementById('pin');
    const box = document.getElementById('pinBox');
    const submit = form.querySelector('button[type=submit]');
    const signIn = () => { Spendee.store.set('signedIn', true); location.href = 'dashboard.html'; };

    // Returning from Reset PIN
    if (Spendee.q('reset')) setTimeout(() => Spendee.toast('PIN updated — sign in with your new PIN'), 450);

    // ---- PIN validation -------------------------------------------------
    const err = document.createElement('p');
    err.className = 'pin-err'; err.id = 'pinErr'; err.setAttribute('role', 'alert');
    err.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg><span></span>';
    form.appendChild(err);
    input.setAttribute('aria-describedby', 'pinErr');
    const clearErr = () => { box.classList.remove('is-error'); err.classList.remove('show'); input.removeAttribute('aria-invalid'); };
    input.addEventListener('input', clearErr);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const len = input.value.replace(/\D/g, '').length;
      if (len < 4) {
        err.querySelector('span').textContent = len === 0 ? 'Enter your 4-digit PIN' : `Enter all 4 digits · ${4 - len} more to go`;
        box.classList.add('is-error'); err.classList.add('show'); input.setAttribute('aria-invalid', 'true');
        box.classList.remove('is-shake'); void box.offsetWidth; box.classList.add('is-shake');
        Spendee.haptic(); input.focus();
        return;
      }
      input.blur();
      await Spendee.loading(submit, 1000);
      signIn();
    });

    // ---- Google account chooser ------------------------------------------
    const choose = document.getElementById('gChoose'), other = document.getElementById('gOtherForm');
    const gTitle = document.getElementById('gTitle'), gSub = document.getElementById('gSub');
    const showChoose = () => { choose.hidden = false; other.hidden = true; gTitle.textContent = 'Choose an account'; gSub.textContent = 'to continue to Spendee'; };
    document.getElementById('googleSheet').addEventListener('sheet:close', () => setTimeout(showChoose, 320));
    document.getElementById('gJayanta').addEventListener('click', async (e) => {
      const b = e.currentTarget; b.classList.add('is-loading'); b.setAttribute('aria-busy', 'true');
      gSub.textContent = 'Signing in as jayanta.adhikari@example.com…';
      await Spendee.wait(1200); signIn();
    });
    document.getElementById('gOther').addEventListener('click', () => {
      choose.hidden = true; other.hidden = false; gTitle.textContent = 'Sign in'; gSub.textContent = 'Use your Google account';
      setTimeout(() => document.getElementById('gEmail').focus(), 60);
    });
    document.getElementById('gBack').addEventListener('click', showChoose);
    other.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!Spendee.validate(other)) return;
      await Spendee.loading(document.getElementById('gNext'), 1100);
      signIn();
    });

    // ---- Face ID ----------------------------------------------------------
    const bioBtn = document.querySelector('[data-biometric]');
    let cancelled = false;
    async function faceId() {
      cancelled = false;
      const wrap = document.createElement('div'); wrap.className = 'dialog-wrap';
      wrap.innerHTML = `<div class="dialog faceid" role="alertdialog" aria-modal="true" aria-labelledby="fidT" aria-describedby="fidM">
        <div class="faceid__glyph" aria-hidden="true">
          <svg class="faceid__face" width="84" height="84" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15V9a5 5 0 0 1 5-5h6M33 4h6a5 5 0 0 1 5 5v6M44 33v6a5 5 0 0 1-5 5h-6M15 44H9a5 5 0 0 1-5-5v-6"/><path d="M16 17v4M32 17v4M24 17v10h-2M17.5 32.5a9 9 0 0 0 13 0"/></svg>
          <span class="faceid__scan"></span>
          <span class="faceid__ok"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
        </div>
        <p class="dialog__title" id="fidT">Face ID</p>
        <p class="dialog__msg" id="fidM" role="status" aria-live="polite">Look at your phone to sign in</p>
        <div class="dialog__actions" style="grid-template-columns:1fr;margin-top:18px"><button class="btn btn--neutral" type="button" data-cancel>Use PIN instead</button></div>
      </div>`;
      const dlg = wrap.querySelector('.faceid');
      const close = () => { wrap.classList.remove('open'); setTimeout(() => wrap.remove(), 200); document.removeEventListener('keydown', esc); };
      const esc = (e) => { if (e.key === 'Escape') cancel(); };
      const cancel = () => { cancelled = true; close(); input.focus(); };
      wrap.querySelector('[data-cancel]').addEventListener('click', cancel);
      wrap.addEventListener('click', (e) => { if (e.target === wrap) cancel(); });
      document.addEventListener('keydown', esc);
      document.body.appendChild(wrap);
      requestAnimationFrame(() => { wrap.classList.add('open'); wrap.querySelector('[data-cancel]').focus(); });
      if (Spendee.q('capture')) return;
      await Spendee.wait(1700);
      if (cancelled) return;
      dlg.classList.add('is-ok'); Spendee.haptic();
      wrap.querySelector('#fidT').textContent = 'Signed in';
      wrap.querySelector('#fidM').textContent = 'Welcome back, Jayanta';
      await Spendee.wait(900);
      if (cancelled) return;
      signIn();
    }
    bioBtn.addEventListener('click', (e) => { e.preventDefault(); faceId(); });
    if (Spendee.q('bio')) faceId();
  })();
</script>
</body>
</html>
