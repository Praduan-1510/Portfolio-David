<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voyager · Change Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/voyager.css">
<style>
  .cp-hero { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 16px; background: var(--grey-2); margin-bottom: 24px; }
  .cp-hero__ic { width: 48px; height: 48px; border-radius: 14px; background: var(--navy); color: var(--orange); display: grid; place-items: center; flex-shrink: 0; }
  .cp-hero p { font-size: 13px; line-height: 1.45; color: var(--text-3); }
  .cp-hero b { display: block; font-size: 15px; color: #000; margin-bottom: 2px; }
  .rules { display: grid; gap: 7px; margin-top: 12px; }
  .rule { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-4); transition: color var(--dur); }
  .rule i { width: 18px; height: 18px; border-radius: 50%; background: #EDEDED; display: grid; place-items: center; color: transparent; transition: background var(--dur), color var(--dur); flex-shrink: 0; }
  .rule.ok { color: #1F6B1F; }
  .rule.ok i { background: var(--valid-bg); color: var(--valid); }
  .cp-forgot { display: block; margin: 8px 0 0 1px; }
  .fg + .fg { margin-top: 20px; }
</style>
</head>
<body>
<main class="page page--cta" aria-label="Change password">
  <header class="phead">
    <a class="phead__back tap" href="settings.html" data-go="back" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H3.5M10.5 4.5 3 12l7.5 7.5"/></svg>
    </a>
    <div class="phead__titles"><h1 class="phead__title">Change Password</h1></div>
  </header>

  <section class="psheet">
    <div class="cp-hero enter"><span class="cp-hero__ic" data-icon="lock" data-size="24"></span><p><b>Keep your trips safe</b><span id="lastChanged">Last changed 4 months ago. You’ll stay signed in on this device.</span></p></div>
    <form id="form" novalidate>
      <div class="fg">
        <label class="label" for="cur">Current password<span class="req">*</span></label>
        <div class="field-wrap"><input class="field" type="password" id="cur" autocomplete="current-password" data-validate="required"><button type="button" class="field-wrap__btn" data-pw-toggle aria-label="Show password"></button></div>
        <a class="link cp-forgot" href="forgot-password.html">Forgot your password?</a>
      </div>
      <div class="fg">
        <label class="label" for="pw">New password<span class="req">*</span></label>
        <div class="field-wrap"><input class="field" type="password" id="pw" autocomplete="new-password" data-validate="required|password" aria-describedby="rules"><button type="button" class="field-wrap__btn" data-pw-toggle aria-label="Show password"></button></div>
        <div class="strength" data-strength-for="pw"><i></i><i></i><i></i><i></i></div><p class="strength-label" data-strength-label aria-live="polite"></p>
        <div class="rules" id="rules">
          <p class="rule" data-r="len"><i></i>At least 8 characters</p>
          <p class="rule" data-r="mix"><i></i>Upper and lower case letters</p>
          <p class="rule" data-r="num"><i></i>At least one number</p>
          <p class="rule" data-r="diff"><i></i>Different from your current password</p>
        </div>
      </div>
      <div class="fg">
        <label class="label" for="pw2">Confirm new password<span class="req">*</span></label>
        <div class="field-wrap"><input class="field" type="password" id="pw2" autocomplete="new-password" data-validate="required|match" data-match="#pw"><button type="button" class="field-wrap__btn" data-pw-toggle aria-label="Show password"></button></div>
      </div>
      <label class="check mt-24"><input type="checkbox" id="others" checked><span>Sign out of all other devices</span></label>
      <p class="small mt-12">Demo tip: any current password works except “wrong”.</p>
    </form>
  </section>

  <div class="cta-bar"><div class="cta-bar__in">
    <button class="btn btn--primary" type="submit" form="form" id="save"><span>Update Password</span></button>
  </div></div>
</main>

<script src="../assets/js/app.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  document.querySelectorAll('.rule i').forEach((i) => { i.innerHTML = V.icon('check', 11, 'stroke-width="3.4"'); });
  const rules = () => {
    const v = $('#pw').value;
    const r = { len: v.length >= 8, mix: /[a-z]/.test(v) && /[A-Z]/.test(v), num: /\d/.test(v), diff: !!v && v !== $('#cur').value };
    Object.entries(r).forEach(([k, ok]) => document.querySelector(`[data-r="${k}"]`).classList.toggle('ok', ok));
    return r;
  };
  $('#pw').addEventListener('input', rules); $('#cur').addEventListener('input', rules);
  const setErr = (inp, msg) => {
    const fg = inp.closest('.fg'); fg.classList.add('has-error'); inp.setAttribute('aria-invalid', 'true');
    let et = fg.querySelector('.error-text'); if (!et) { et = document.createElement('span'); et.className = 'error-text'; et.setAttribute('role', 'alert'); fg.appendChild(et); }
    et.innerHTML = V.icon('warning', 14, 'stroke-width="2"') + `<span>${V.esc(msg)}</span>`; inp.focus();
  };
  const last = V.store.get('pwChangedAt', null);
  if (last) $('#lastChanged').textContent = `Last changed ${V.date.fmt(last, 'long')}. You’ll stay signed in on this device.`;

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!V.validate($('#form'))) return;
    const r = rules();
    if (!r.mix) { setErr($('#pw'), 'Add both upper and lower case letters'); return; }
    if (!r.diff) { setErr($('#pw'), 'Choose a password you haven’t used before'); return; }
    await V.loading($('#save'), 1000);
    if ($('#cur').value.trim().toLowerCase() === 'wrong') { setErr($('#cur'), 'That’s not your current password. Try again or reset it.'); return; }
    V.store.set('pwChangedAt', V.today);
    V.toast($('#others').checked ? 'Password updated · other devices signed out' : 'Password updated');
    await V.wait(800);
    if (history.length > 1 && document.referrer) history.back(); else location.href = 'settings.html';
  });
})();
</script>
</body>
</html>
