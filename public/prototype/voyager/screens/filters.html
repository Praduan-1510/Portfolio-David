<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voyager · Filters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/voyager.css">
<style>
  .psheet.fl { margin-top: 19px; padding: 27px 17px 23px; border-radius: var(--r-sheet) var(--r-sheet) 0 0; }
  .page > .psheet.fl { padding-bottom: 15px; }
  .fl__top { display: flex; align-items: center; justify-content: space-between; height: 20px; padding: 0 0 0 11px; }
  .fl__title { font-size: 16px; line-height: 20px; font-weight: 700; color: var(--navy); }
  .fl__acts { display: flex; align-items: center; gap: 6px; margin-right: -6px; }
  .fl__reset { font-size: 13px; font-weight: 500; color: var(--orange); padding: 12px 6px; }
  .fl__reset[aria-disabled="true"] { opacity: .45; }
  .fl__close { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #333; background: var(--grey-1); position: relative; }
  .fl__close::after { content: ''; position: absolute; inset: -6px; }
  .fl__h { display: flex; align-items: baseline; justify-content: space-between; font-size: 18px; line-height: 22px; font-weight: 600; color: #5E5E5E; text-transform: uppercase; padding-left: 11px; margin-top: 42px; }
  .fl__h:first-of-type { margin-top: 28px; }
  .fl__h small { font-size: 12px; font-weight: 600; color: var(--orange); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; padding-right: 13px; }
  .fl__budget { width: 308px; margin: 19px 0 0 16px; padding: 12px 16px 12px; border-radius: var(--r-card); background: var(--grey-1); box-shadow: 0 4px 8px rgba(0,0,0,.15); }
  .fl__budget .drange__vals { font-size: 17px; line-height: 20px; font-weight: 600; color: #555; margin-bottom: 10px; }
  .fl__budget .drange { margin: 0 4px 0 3px; }
  .fl__chips { display: flex; flex-wrap: wrap; gap: 14px 10px; margin-top: 23px; }
  .fl__chips .chip { padding: 0 20px; font-size: 12.5px; background: #E8E7E7; }
  .fl__chips .chip:hover { background: #DCDBDB; }
  .fl__chips .chip[aria-pressed="true"] { background: var(--orange); }
  .fl__chips .chip svg { margin-left: -1px; }
  .fl__incl { width: 316px; margin: 16px 0 0 12px; padding: 11px 7px 10px 9px; border-radius: var(--r-md); background: #F7F7F7; }
  .fl__row { display: flex; align-items: center; gap: 10px; height: 34px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .fl__row .ic { width: 24px; display: grid; place-items: center; color: #1F1F1F; }
  .fl__row .lb { flex: 1; font-size: 14.5px; font-weight: 500; color: #555; margin-left: 1px; }
  .fl__row .toggle { margin-right: 0; }
  .fl__hint { font-size: 12px; color: var(--text-4); text-align: center; margin-top: 10px; min-height: 0; }
  .cta-bar__in.fl__cta { padding: 20px 23px 22px; }
  .fl__cta .btn { height: 34px; font-size: 16px; }
  .fl__cta .btn::before { content: ''; position: absolute; inset: -6px 0; }
  .fl__cta .btn b { font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main class="page page--cta" aria-label="Filters">
  <section class="psheet fl" aria-labelledby="flTitle">
    <div class="fl__top">
      <h1 class="fl__title" id="flTitle">Filters</h1>
      <div class="fl__acts">
        <button class="fl__reset tap" type="button" id="reset">Reset all</button>
        <a class="fl__close tap" href="search-results.html" id="close" aria-label="Close filters"><span data-icon="close" data-size="14" data-sw="2.4"></span></a>
      </div>
    </div>

    <h2 class="fl__h" id="hBudget">Budget (per person) <small id="budgetLive" aria-live="polite">$1,000–$2,900</small></h2>
    <div class="fl__budget" role="group" aria-labelledby="hBudget">
      <div class="drange__vals"><span>$500</span><span>$4500</span></div>
      <div class="drange" id="budget" data-min="500" data-max="4500" data-step="100" data-from="1000" data-to="2900" data-label-from="Minimum budget" data-label-to="Maximum budget"></div>
    </div>

    <h2 class="fl__h" id="hDur">Duration</h2>
    <div class="fl__chips" id="dur" role="group" aria-labelledby="hDur" data-kind="multi">
      <button class="chip" type="button" data-value="1-3">1–3 Days</button>
      <button class="chip" type="button" data-value="4-7">4–7 Days</button>
      <button class="chip" type="button" data-value="8-14">8–14 Days</button>
      <button class="chip" type="button" data-value="15+">2+ Weeks</button>
    </div>

    <h2 class="fl__h" id="hStyle">Travel Style</h2>
    <div class="fl__chips" id="style" role="group" aria-labelledby="hStyle" data-kind="multi">
      <button class="chip" type="button" data-value="Adventure">Adventure</button>
      <button class="chip" type="button" data-value="Luxury">Luxury</button>
      <button class="chip" type="button" data-value="Cultural">Cultural</button>
      <button class="chip" type="button" data-value="Beach">Beach</button>
      <button class="chip" type="button" data-value="Food &amp; Wine">Food &amp; Wine</button>
      <button class="chip" type="button" data-value="Family">Family</button>
    </div>

    <h2 class="fl__h" id="hRating">Hotel Rating</h2>
    <div class="fl__chips" id="rating" role="group" aria-labelledby="hRating" data-kind="single">
      <button class="chip" type="button" data-value="3" aria-label="3 stars and up">3 <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9L12 2.8Z"/></svg></button>
      <button class="chip" type="button" data-value="4" aria-label="4 stars and up">4 <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9L12 2.8Z"/></svg></button>
      <button class="chip" type="button" data-value="5" aria-label="5 stars">5 <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3-4.6-4.4 6.3-.9L12 2.8Z"/></svg></button>
    </div>

    <h2 class="fl__h" id="hIncl">Inclusions</h2>
    <div class="fl__incl" role="group" aria-labelledby="hIncl">
      <div class="fl__row" data-switch-row>
        <span class="ic"><span data-icon="plane" data-size="25" data-sw="1.4"></span></span><span class="lb" id="lF">Flights Included</span>
        <button class="toggle" type="button" role="switch" data-incl="flights" aria-checked="true" aria-labelledby="lF"></button>
      </div>
      <div class="fl__row" data-switch-row>
        <span class="ic"><span data-icon="building" data-size="25" data-sw="1.4"></span></span><span class="lb" id="lH">Hotel Included</span>
        <button class="toggle" type="button" role="switch" data-incl="hotel" aria-checked="true" aria-labelledby="lH"></button>
      </div>
      <div class="fl__row" data-switch-row>
        <span class="ic"><span data-icon="car" data-size="27" data-sw="1.4"></span></span><span class="lb" id="lT">Transfers Included</span>
        <button class="toggle" type="button" role="switch" data-incl="transfers" aria-checked="false" aria-labelledby="lT"></button>
      </div>
    </div>
    <p class="fl__hint" id="hint" aria-live="polite" hidden></p>
  </section>

  <div class="cta-bar"><div class="cta-bar__in fl__cta">
    <button class="btn btn--primary" type="button" id="show"><span>Show <b id="n">148</b> Results</span></button>
  </div></div>
</main>

<script src="../assets/js/app.js"></script>
<script>
(function () {
  const V = window.Voyager; const $ = (s) => document.querySelector(s); const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const BASE = 148;
  const W = (list) => list.reduce((a, d) => a + d.reviews, 0);
  const bucket = (days) => days <= 3 ? '1-3' : days <= 7 ? '4-7' : days <= 14 ? '8-14' : '15+';
  const DEFAULT_F = { budget: [1000, 2900], duration: ['4-7'], styles: ['Adventure', 'Beach'], rating: 3, incl: { flights: true, hotel: true, transfers: false } };
  const CLEAR_F = { budget: [500, 4500], duration: [], styles: [], rating: 0, incl: { flights: false, hotel: false, transfers: false } };
  const passF = (d, f) => d.from >= f.budget[0] && d.from <= f.budget[1]
    && (!f.duration.length || f.duration.includes(bucket(d.days)))
    && (!f.styles.length || d.styles.some((s) => f.styles.includes(s)))
    && d.hotelStars >= (f.rating || 0)
    && Object.keys(f.incl).every((k) => !f.incl[k] || d.inclusions[k]);
  // Counts are relative to the search they refine: the default search is Europe, and its default filters show 148.
  const EUROPE = (d) => d.region === 'Europe';
  const REF = W(V.destinations.filter(EUROPE).filter((d) => passF(d, DEFAULT_F))) || 1;

  const rawQ = (V.q('q') || '').trim();
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const matchQ = (d) => !rawQ || /^europe$/i.test(rawQ) ? EUROPE(d) : [d.name, d.country, d.region, d.package.name, ...d.styles].some((s) => norm(s).includes(norm(rawQ)) || norm(rawQ).includes(norm(s)));
  const back = 'search-results.html' + (rawQ ? '?q=' + encodeURIComponent(rawQ) : '');
  $('#close').href = back;

  const stored = V.store.get('vb:filters', null);
  const initial = JSON.parse(JSON.stringify(stored ? { budget: stored.budget, duration: stored.duration, styles: stored.styles, rating: stored.rating, incl: stored.incl } : DEFAULT_F));
  const startJSON = JSON.stringify(initial);

  // chips: multi groups toggle; single group (rating) toggles with deselect
  const setChips = (el, vals) => $$('.chip', el).forEach((c) => c.setAttribute('aria-pressed', String(vals.includes(c.dataset.value))));
  const getChips = (el) => $$('.chip[aria-pressed="true"]', el).map((c) => c.dataset.value);
  $$('.fl__chips').forEach((g) => g.addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    const on = c.getAttribute('aria-pressed') !== 'true';
    if (g.dataset.kind === 'single') $$('.chip', g).forEach((x) => x.setAttribute('aria-pressed', 'false'));
    c.setAttribute('aria-pressed', String(on)); V.haptic(); update();
  }));

  const budget = $('#budget');
  const apply = (f) => {
    budget.set(f.budget[0], f.budget[1]);
    setChips($('#dur'), f.duration); setChips($('#style'), f.styles); setChips($('#rating'), f.rating ? [String(f.rating)] : []);
    $$('[data-incl]').forEach((t) => t.setAttribute('aria-checked', String(!!f.incl[t.dataset.incl])));
  };
  const read = () => {
    const b = budget.value(); const r = getChips($('#rating'))[0];
    const incl = {}; $$('[data-incl]').forEach((t) => (incl[t.dataset.incl] = t.getAttribute('aria-checked') === 'true'));
    return { budget: [b.from, b.to], duration: getChips($('#dur')), styles: getChips($('#style')), rating: r ? +r : 0, incl };
  };

  let lastN = null;
  const update = () => {
    const f = read();
    const list = V.destinations.filter(matchQ).filter((d) => passF(d, f));
    const n = list.length ? Math.max(list.length, Math.round(BASE * W(list) / REF)) : 0;
    $('#budgetLive').textContent = `$${V.fmtNum(f.budget[0])}–$${V.fmtNum(f.budget[1])}`;
    const nEl = $('#n');
    if (n !== lastN) { nEl.textContent = V.fmtNum(n); lastN = n; }
    const btn = $('#show');
    btn.disabled = n === 0;
    btn.firstElementChild.innerHTML = n ? `Show <b id="n">${V.fmtNum(n)}</b> Result${n === 1 ? '' : 's'}` : 'No Matches';
    const hint = $('#hint');
    hint.hidden = n !== 0;
    hint.textContent = n ? '' : 'Nothing fits every filter. Try widening the budget or removing a style.';
    $('#reset').setAttribute('aria-disabled', String(JSON.stringify(f) === JSON.stringify(CLEAR_F)));
    return { f, n, list };
  };
  budget.addEventListener('change', () => update());
  document.addEventListener('change', (e) => { if (e.target.matches && e.target.matches('[data-incl]')) update(); });

  apply(initial); update();

  $('#reset').addEventListener('click', () => {
    const prev = read();
    apply(CLEAR_F); update();
    V.toast('All filters cleared', { action: 'Undo', onAction: () => { apply(prev); update(); } });
  });

  $('#close').addEventListener('click', async (e) => {
    e.preventDefault();
    if (JSON.stringify(read()) !== startJSON) {
      const ok = await V.dialog({ title: 'Discard changes?', message: 'Your filter changes haven’t been applied to the results yet.', confirm: 'Discard', cancel: 'Keep editing', tone: 'warn' });
      if (!ok) return;
    }
    if (history.length > 1 && document.referrer) history.back(); else location.href = back;
  });

  $('#show').addEventListener('click', async (e) => {
    const { f, n } = update(); if (!n) return;
    V.store.set('vb:filters', Object.assign(f, { applied: true, n }));
    await V.loading(e.currentTarget, 700);
    location.href = back;
  });
})();
</script>
</body>
</html>
