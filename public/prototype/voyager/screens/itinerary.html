<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voyager · Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/voyager.css">
<style>
  .phead { padding-right: 10px; }
  .it-actions { display: flex; gap: 2px; margin-top: -4px; }
  .it-actions button { width: 40px; height: 40px; display: grid; place-items: center; color: #fff; border-radius: 10px; }
  .it-actions button:active { background: rgba(255,255,255,.1); }
  .days { margin: 4px 0 0 25px; padding-right: 21px; gap: 10px; width: 363px; flex-shrink: 0; scroll-snap-type: x proximity; }
  .day { width: 63px; height: 36px; scroll-snap-align: start; gap: 0; }
  .day b { font-size: 12px; line-height: 14px; font-weight: 600; }
  .day small { font-size: 10px; line-height: 12px; }
  .psheet { margin-top: 26px; padding: 0 0 36px; border-radius: 0 0 var(--r-sheet) var(--r-sheet); }
  .it-photo { height: 265px; overflow: hidden; position: relative; }
  .it-photo img { width: 100%; height: 100%; object-fit: cover; transition: opacity 260ms var(--ease-out); }
  .it-photo img.is-fading { opacity: 0; }
  .it-photo__credit { position: absolute; right: 10px; bottom: 10px; height: 24px; padding: 0 10px; border-radius: 12px; background: rgba(20,33,61,.6); color: #fff; font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
  .it-body { padding: 0 43px 0 13px; transition: opacity 200ms var(--ease-out); }
  .it-body.is-fading { opacity: 0; }
  .it-title { font-size: 16px; line-height: 20px; font-weight: 600; color: var(--text-2); margin: 21px 0 0 1px; }
  .tl { margin-top: 26px; }
  .tl__item { column-gap: 14px; padding-bottom: 36px; }
  .tl__item::before { top: 60px; height: 54px; left: 12.5px; }
  .tl__card { width: 276px; min-height: 68px; padding: 8px 10px 9px 20px; gap: 11px; cursor: pointer; transition: transform var(--dur) var(--ease-out), box-shadow var(--dur); }
  .tl__card:hover { box-shadow: 0 4px 14px rgba(20,33,61,.08); }
  .tl__card:active { transform: scale(.98); }
  .tl__icon { width: 30px; }
  .tl__meta { font-size: 10.5px; }
  .tl__title { font-size: 15px; line-height: 18px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl__sub { font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl__card > span:last-child { min-width: 0; }
  .it-foot { margin: 30px 13px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .it-foot .btn { height: 46px; font-size: 14px; }
  .it-note { margin: 14px 13px 0; font-size: 12px; color: var(--text-4); text-align: center; }

  .ev-head { display: flex; gap: 14px; align-items: center; }
  .ev-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--orange-tint); color: var(--orange); display: grid; place-items: center; flex-shrink: 0; }
  .ev-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .ev-actions > * { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 72px; border-radius: 14px; background: var(--grey-1); font-size: 12px; font-weight: 600; color: #222; }
  .ev-actions > * span:first-child { color: var(--navy); }
</style>
</head>
<body>
<main class="page" aria-label="Trip itinerary">
  <header class="phead">
    <a class="phead__back tap" href="trips.html" data-go="back" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H3.5M10.5 4.5 3 12l7.5 7.5"/></svg>
    </a>
    <div class="phead__titles"><h1 class="phead__title" id="title">Paris Itinerary</h1></div>
    <div class="it-actions">
      <button class="tap" type="button" data-sheet="share" aria-label="Share itinerary"><span data-icon="share" data-size="22" data-sw="2"></span></button>
      <button class="tap" type="button" id="dl" aria-label="Download itinerary PDF"><span data-icon="download" data-size="22" data-sw="2"></span></button>
    </div>
  </header>

  <div class="days" id="days" data-options aria-label="Trip days"></div>

  <section class="psheet psheet--grey">
    <div class="it-photo ph ph--dusk"><img id="photo" src="../assets/img/itin-paris-sunset.jpg" alt="Eiffel Tower at sunset from the Seine"></div>
    <div class="it-body" id="body">
      <h2 class="it-title" id="dayTitle">Day 1 — Arrival &amp; Orientation</h2>
      <ol class="tl" id="tl" data-delegate></ol>
    </div>
    <div class="it-foot">
      <a class="btn btn--navy" id="ticketBtn" href="e-ticket.html?ref=VYG-4892-PAR"><span data-icon="ticket" data-size="18"></span><span>E-Ticket</span></a>
      <a class="btn btn--outline-soft" id="modBtn" href="modify-booking.html?trip=paris-aug"><span data-icon="edit" data-size="18"></span><span>Modify</span></a>
    </div>
    <p class="it-note" id="note">Saved offline. Times are local. Tap any stop for details.</p>
  </section>

  <nav data-tabbar="trip" data-tabbar-grey></nav>
</main>

<section class="sheet" id="event" aria-labelledby="evT">
  <div class="sheet__head">
    <div class="ev-head"><span class="ev-ic" id="evIc"></span><div><p class="sheet__title" id="evT">Depart LHR → CDG</p><p class="sheet__sub" id="evSub">09:00 AM · Flight</p></div></div>
    <button class="sheet__close tap" type="button" data-close aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m1 1 10 10M11 1 1 11"/></svg></button>
  </div>
  <div class="kvs" id="evKvs"></div>
  <div class="ev-actions" id="evActions"></div>
</section>

<section class="sheet" id="share" aria-labelledby="shT">
  <div class="sheet__head">
    <div><p class="sheet__title" id="shT">Share itinerary</p><p class="sheet__sub" id="shSub">Send the day-by-day plan to your travel companions.</p></div>
    <button class="sheet__close tap" type="button" data-close aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m1 1 10 10M11 1 1 11"/></svg></button>
  </div>
  <div class="list list--grey">
    <button class="list__item" type="button" data-share="copy"><span class="list__icon ic-navy" data-icon="copy"></span><span class="list__body"><span class="list__title">Copy link</span><span class="list__sub" id="shLink">voyager.app/i/VYG-4892-PAR</span></span></button>
    <button class="list__item" type="button" data-share="Messages"><span class="list__icon ic-navy" data-icon="chat"></span><span class="list__body"><span class="list__title">Send in Messages</span></span></button>
    <button class="list__item" type="button" data-share="Email"><span class="list__icon ic-navy" data-icon="envelope"></span><span class="list__body"><span class="list__title">Email itinerary</span></span></button>
    <button class="list__item" type="button" data-share="Calendar"><span class="list__icon ic-navy" data-icon="calendar"></span><span class="list__body"><span class="list__title">Add all stops to Calendar</span></span></button>
  </div>
</section>

<script src="../assets/js/app.js"></script>
<script>
  (function () {
    const V = window.Voyager, D = V.date;
    const $ = (s) => document.querySelector(s);
    const key = V.q('trip') || 'paris-aug';
    const trip = V.trips.get(key) || V.trips.get('paris-aug') || V.trips.list()[0];
    const d = V.dest(trip.dest) || V.dest('paris');
    const TR = V.travel(d.id), AIRPORT = TR.airport[0];
    const flight = trip.flight || TR.out, flightBack = d.id === 'paris' ? 'BA318' : TR.back;
    const hotel = trip.hotel || TR.hotel;
    const ev = (time, kind, icon, title, sub, extra = {}) => Object.assign({ time, kind, icon, title, sub }, extra);

    // ---- Paris (the designed trip): 8 days, Aug 12–19
    const PARIS = [
      { name: 'Arrival & Orientation', img: 'itin-paris-sunset', alt: 'Eiffel Tower at sunset from the Seine', ev: [
        ev('09:00 AM', 'Flight', 'plane', 'Depart LHR → CDG', `British Airways ${flight} · 1h 20m`, { addr: 'London Heathrow, Terminal 5', conf: trip.ref, ticket: true, phone: true }),
        ev('12:30 PM', 'Transfer', 'car', 'Airport To Hotel', 'Private Transfer · CDG → Le Marais', { addr: 'CDG Terminal 2A · Arrivals Gate 2', conf: 'TRF-4892', phone: true, ticket: true }),
        ev('2:00 PM', 'Hotel', 'building', `Check-In: ${hotel}`, '4★ Boutique · Rue De Bretagne', { addr: '44 Rue De Bretagne, 75003 Paris', conf: 'HTL-4892-8231', phone: true, ticket: true }),
        ev('7:30 PM', 'Dinner', 'cutlery', 'Welcome Dinner', 'Le Comptoir Du Relais · Bistro', { addr: '9 Carrefour De L’Odéon, 75006 Paris', conf: 'Table for 2 · 7:30 PM', phone: true }),
      ] },
      { name: 'Louvre & Tuileries', img: 'gal-louvre', alt: 'The Louvre pyramid', ev: [
        ev('09:30 AM', 'Museum', 'ticket', 'Louvre Museum', 'Skip-The-Line · Pyramid Entrance', { addr: 'Rue De Rivoli, 75001 Paris', conf: 'LVR-20931' }),
        ev('12:30 PM', 'Lunch', 'cutlery', 'Café Marly', 'Terrace Overlooking The Pyramid', { addr: '93 Rue De Rivoli, 75001 Paris', conf: 'Walk-in', phone: true }),
        ev('2:30 PM', 'Walk', 'map-pin', 'Tuileries Garden', 'Stroll To Place De La Concorde', { addr: 'Place De La Concorde, 75001 Paris' }),
        ev('7:00 PM', 'Dinner', 'cutlery', 'Le Fumoir', 'Bistro · Near The Louvre', { addr: '6 Rue De L’Amiral De Coligny, 75001', conf: 'Table for 2 · 7:00 PM', phone: true }),
      ] },
      { name: 'Montmartre & Sacré-Cœur', img: 'gal-montmartre', alt: 'Montmartre street with Sacré-Cœur', ev: [
        ev('10:00 AM', 'Tour', 'book', 'Montmartre Walking Tour', 'Guided · Meet At Anvers Métro', { addr: 'Métro Anvers, 75018 Paris', conf: 'VYG-TOUR-311', phone: true }),
        ev('12:00 PM', 'Visit', 'building', 'Sacré-Cœur Basilica', 'Dome Climb · 300 Steps', { addr: '35 Rue Du Chevalier De La Barre' }),
        ev('1:30 PM', 'Lunch', 'cutlery', 'Place Du Tertre', 'Artists’ Square · Crêperie', { addr: 'Place Du Tertre, 75018 Paris' }),
        ev('8:00 PM', 'Show', 'sparkle', 'Moulin Rouge', 'Dinner & Show · Bd De Clichy', { addr: '82 Boulevard De Clichy, 75018', conf: 'MR-55012', phone: true }),
      ] },
      { name: 'Versailles Day Trip', img: 'gal-versailles', alt: 'Palace of Versailles', ev: [
        ev('08:30 AM', 'Train', 'map', 'RER C To Versailles', 'Saint-Michel → Château · 40m', { addr: 'Gare Saint-Michel Notre-Dame' }),
        ev('10:00 AM', 'Tour', 'building', 'Palace Of Versailles', 'Hall Of Mirrors · Royal Rooms', { addr: 'Place d’Armes, 78000 Versailles', conf: 'VRS-77410' }),
        ev('1:00 PM', 'Lunch', 'cutlery', 'Ore · Alain Ducasse', 'Inside The Palace', { addr: 'Château De Versailles, Pavillon Dufour', phone: true }),
        ev('3:00 PM', 'Gardens', 'map-pin', 'Gardens & Trianon', 'Musical Fountains Show', { addr: 'Jardins Du Château De Versailles' }),
      ] },
      { name: 'Eiffel Tower & Seine Cruise', img: 'gal-seine-cruise', alt: 'Dinner cruise on the Seine', ev: [
        ev('11:00 AM', 'Visit', 'ticket', 'Eiffel Tower Summit', 'Timed Entry · Lift To The Top', { addr: 'Champ De Mars, 75007 Paris', conf: 'EFT-40219' }),
        ev('1:30 PM', 'Lunch', 'cutlery', 'Café De L’Homme', 'Terrace Facing The Tower', { addr: '17 Place Du Trocadéro, 75116', phone: true }),
        ev('4:00 PM', 'Shopping', 'tag', 'Le Marais Boutiques', 'Rue Des Francs-Bourgeois', { addr: 'Le Marais, 75004 Paris' }),
        ev('8:30 PM', 'Cruise', 'compass', 'Seine Dinner Cruise', 'Bateaux Parisiens · 2h 15m', { addr: 'Port De La Bourdonnais, 75007', conf: 'BP-66120', phone: true }),
      ] },
      { name: 'Sainte-Chapelle & Saint-Germain', img: 'gal-paris-cafe', alt: 'Parisian café terrace', ev: [
        ev('10:00 AM', 'Visit', 'ticket', 'Sainte-Chapelle', 'Stained Glass · Île De La Cité', { addr: '10 Boulevard Du Palais, 75001 Paris', conf: 'STC-11873' }),
        ev('1:00 PM', 'Lunch', 'cutlery', 'Café De Flore', 'Saint-Germain Classic', { addr: '172 Bd Saint-Germain, 75006', phone: true }),
        ev('3:00 PM', 'Walk', 'map-pin', 'Luxembourg Gardens', 'Medici Fountain · Sailboats', { addr: 'Rue De Médicis, 75006 Paris' }),
        ev('8:00 PM', 'Dinner', 'cutlery', 'Frenchie', 'Tasting Menu · Rue Du Nil', { addr: '5 Rue Du Nil, 75002 Paris', conf: 'Table for 2 · 8:00 PM', phone: true }),
      ] },
      { name: 'Free Day & Farewell', img: 'hero-paris', alt: 'Eiffel Tower above the Seine', ev: [
        ev('10:00 AM', 'Free Time', 'compass', 'Explore At Your Pace', 'Suggestions In The App', { addr: 'Anywhere in Paris' }),
        ev('1:00 PM', 'Class', 'cutlery', 'French Pastry Class', 'Croissants · Le Marais', { addr: '12 Rue Des Rosiers, 75004', conf: 'PST-2291', phone: true }),
        ev('7:30 PM', 'Dinner', 'cutlery', 'Farewell Dinner', 'Le Train Bleu · Gare De Lyon', { addr: 'Place Louis-Armand, 75012 Paris', conf: 'Table for 2 · 7:30 PM', phone: true }),
      ] },
      { name: 'Departure', img: 'trip-paris', alt: 'Paris skyline', ev: [
        ev('11:00 AM', 'Hotel', 'building', 'Check-Out', `${hotel} · Bags Held Until 2:30 PM`, { addr: '44 Rue De Bretagne, 75003 Paris', conf: 'HTL-4892-8231', phone: true }),
        ev('2:30 PM', 'Transfer', 'car', 'Hotel To Airport', 'Private Transfer · Le Marais → CDG', { addr: 'Hotel Lobby', conf: 'TRF-4892', phone: true, ticket: true }),
        ev('6:25 PM', 'Flight', 'plane', 'Depart CDG → LHR', 'British Airways BA318 · 1h 15m', { addr: 'Paris CDG, Terminal 2A', conf: trip.ref, ticket: true, phone: true }),
      ] },
    ];

    // ---- Any other trip: generated plan
    const generic = () => {
      const n = Math.min(15, D.nights(trip.start, trip.end) + 1);
      const imgs = [d.hero || d.img, d.img];
      // Long-haul lands on a later day: Day 1 is the flight, check-in happens on the day you arrive.
      const arrMins = 9 * 60 + TR.mins + TR.tz(trip.start), off = Math.min(n - 2, Math.floor(arrMins / 1440));
      const clock = (mins) => { mins = ((mins % 1440) + 1440) % 1440; const h = Math.floor(mins / 60), m = mins % 60; return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; };
      const flightEv = ev('09:00 AM', 'Flight', 'plane', `Depart LHR → ${AIRPORT}`, `${flight} · ${trip.cls === 'business' ? 'Business' : 'Economy'}` + (off ? ` · Lands ${D.fmt(D.add(trip.start, off), 'md')}, ${clock(arrMins)}` : ''), { addr: 'London Heathrow', conf: trip.ref, ticket: true, phone: true });
      const arriveEvs = [
        ...(trip.addons && trip.addons.transfer ? [ev(clock(arrMins + 70), 'Transfer', 'car', 'Airport To Hotel', `Private Transfer · ${AIRPORT} → ${hotel}`, { addr: `${AIRPORT} Arrivals`, conf: 'TRF-' + trip.ref.slice(4, 8), phone: true, ticket: true })] : []),
        ev(clock(Math.max(arrMins % 1440 + 150, 14 * 60)), 'Hotel', 'building', `Check-In: ${hotel}`, `${d.hotelStars}★ · ${d.name}`, { addr: `${hotel}, ${d.name}`, conf: 'HTL-' + trip.ref.slice(4, 8), phone: true, ticket: true }),
        // A late landing goes straight to bed: no welcome dinner after an 8:45 PM check-in.
        ...(Math.max(arrMins % 1440 + 150, 14 * 60) <= 18 * 60 ? [ev('8:00 PM', 'Dinner', 'cutlery', 'Welcome Dinner', 'Local Favourite', { addr: d.name, phone: true })] : []),
      ];
      return Array.from({ length: n }, (_, i) => {
        if (i === 0 && off) return { name: 'Travel Day', img: imgs[0], alt: d.name, ev: [flightEv] };
        if (i === off) return { name: 'Arrival & Check-In', img: imgs[0], alt: d.name, ev: off ? arriveEvs : [flightEv, ...arriveEvs] };
        if (i === n - 1) return { name: 'Departure', img: imgs[1], alt: d.name, ev: [
          ev('10:00 AM', 'Hotel', 'building', 'Check-Out', hotel, { addr: `${hotel}, ${d.name}`, conf: 'HTL-' + trip.ref.slice(4, 8) }),
          ev('2:00 PM', 'Flight', 'plane', `Depart ${AIRPORT} → LHR`, `${flightBack} · Return`, { addr: `${AIRPORT} Airport`, conf: trip.ref, ticket: true, phone: true }),
        ] };
        const tourDay = i === off + 1 && trip.addons && trip.addons.tour;
        return { name: tourDay ? `Guided ${d.name} Tour` : `Explore ${d.name}`, img: imgs[i % 2], alt: d.name, ev: [
          ...(tourDay ? [ev('10:00 AM', 'Tour', 'book', 'Guided City Tour', 'Half Day · Local Expert', { addr: 'Hotel lobby pickup', conf: 'VYG-TOUR-' + trip.ref.slice(4, 8), phone: true })] : [ev('10:00 AM', 'Free Time', 'compass', 'Morning At Leisure', 'Suggestions In The App', { addr: d.name })]),
          ev('1:00 PM', 'Lunch', 'cutlery', 'Lunch Recommendation', 'Chef’s Pick Near You', { addr: d.name, phone: true }),
          ev('7:30 PM', 'Dinner', 'cutlery', 'Dinner Reservation', 'Booked By Voyager', { addr: d.name, conf: 'Table for ' + (trip.adults + trip.children), phone: true }),
        ] };
      });
    };
    const DAYS = d.id === 'paris' ? PARIS : generic();

    // ---- header, chips
    $('#title').textContent = `${d.name} Itinerary`;
    document.title = `Voyager · ${d.name} Itinerary`;
    $('#ticketBtn').href = `e-ticket.html?ref=${encodeURIComponent(trip.ref)}`;
    $('#modBtn').href = `modify-booking.html?trip=${encodeURIComponent(trip.id)}`;
    if (trip.status === 'cancelled' || trip.status === 'past') { $('#modBtn').hidden = true; $('.it-foot').style.gridTemplateColumns = '1fr'; }
    const days = $('#days');
    days.innerHTML = DAYS.map((x, i) => { const iso = D.add(trip.start, i); return `<button class="day" type="button" data-option data-value="${i}" aria-checked="${i === 0}" aria-label="Day ${i + 1}, ${D.fmt(iso, 'full')}: ${V.esc(x.name)}"><b>Day ${i + 1}</b><small>${D.fmt(iso, 'md')}</small></button>`; }).join('');
    days.querySelectorAll('.day').forEach((b) => b.setAttribute('role', 'radio'));

    let cur = -1;
    const show = (i, animate) => {
      if (i === cur) return; cur = i;
      const day = DAYS[i]; const photo = $('#photo'); const body = $('#body');
      const apply = () => {
        photo.src = V.img(day.img); photo.alt = day.alt;
        $('#dayTitle').textContent = `Day ${i + 1} — ${day.name}`;
        const designed = d.id === 'paris' && i === 0;   // the design shows progress on Day 1
        $('#tl').innerHTML = day.ev.map((e, k) => {
          const st = designed ? (k === 0 ? 'is-done' : k === 1 ? 'is-now' : '') : '';
          return `<li class="tl__item ${st}"><span class="tl__dot" aria-hidden="true"></span>
            <button class="tl__card" type="button" data-ev="${k}" aria-label="${V.esc(e.time)}, ${V.esc(e.kind)}: ${V.esc(e.title)}. ${V.esc(e.sub)}">
              <span class="tl__icon">${V.icon(e.icon, e.icon === 'plane' ? 28 : 30)}</span>
              <span><span class="tl__meta">${V.esc(e.time)} · ${V.esc(e.kind)}</span><span class="tl__title">${V.esc(e.title)}</span><span class="tl__sub">${V.esc(e.sub)}</span></span>
            </button></li>`;
        }).join('');
      };
      if (!animate) { apply(); return; }
      photo.classList.add('is-fading'); body.classList.add('is-fading');
      setTimeout(() => { apply(); requestAnimationFrame(() => { photo.classList.remove('is-fading'); body.classList.remove('is-fading'); }); }, 180);
    };
    const start = Math.max(0, Math.min(DAYS.length - 1, (+V.q('day') || 1) - 1));
    days.select(String(start)); show(start, false);
    if (start) days.querySelector(`[data-value="${start}"]`).scrollIntoView({ inline: 'center', block: 'nearest' });
    days.addEventListener('click', (e) => { const b = e.target.closest('.day'); if (!b) return; days.select(b.dataset.value); show(+b.dataset.value, true); b.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' }); });

    // ---- event detail sheet
    $('#tl').addEventListener('click', (e) => {
      const c = e.target.closest('[data-ev]'); if (!c) return;
      const x = DAYS[cur].ev[+c.dataset.ev]; const date = D.fmt(D.add(trip.start, cur), 'full');
      $('#evIc').innerHTML = V.icon(x.icon, 24);
      $('#evT').textContent = x.title;
      $('#evSub').textContent = `${date} · ${x.time} · ${x.kind}`;
      $('#evKvs').innerHTML = [['Details', x.sub], ['Address', x.addr || d.name], ['Confirmation', x.conf || 'Not required']]
        .map(([k, v]) => `<div><span class="k">${k}</span><span class="v">${V.esc(v)}</span></div>`).join('');
      const acts = [`<button type="button" data-act="Opening directions in Maps…"><span>${V.icon('map', 22)}</span><span>Directions</span></button>`];
      acts.push(x.phone ? `<button type="button" data-act="Calling ${V.esc(x.title.replace(/^Check-(In|Out):? ?/, '') || 'venue')}…"><span>${V.icon('phone', 22)}</span><span>Call</span></button>` : `<button type="button" data-act="Saved to your calendar"><span>${V.icon('calendar', 22)}</span><span>Calendar</span></button>`);
      acts.push(x.ticket ? `<a href="e-ticket.html?ref=${encodeURIComponent(trip.ref)}"><span>${V.icon('ticket', 22)}</span><span>E-Ticket</span></a>` : `<a href="support.html"><span>${V.icon('headset', 22)}</span><span>Help</span></a>`);
      $('#evActions').innerHTML = acts.join('');
      V.sheet.open('event');
    });
    $('#evActions').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b) { V.sheet.close(); V.toast(b.dataset.act); } });
    if (V.q('sheet') === 'event') setTimeout(() => $('#tl [data-ev]').click(), 0);

    // ---- share + download
    $('#shLink').textContent = `voyager.app/i/${trip.ref}`;
    document.querySelectorAll('[data-share]').forEach((b) => b.addEventListener('click', async () => {
      const how = b.dataset.share; V.sheet.close();
      if (how === 'copy') { try { await navigator.clipboard.writeText(`https://voyager.app/i/${trip.ref}`); } catch (e) {} V.toast('Itinerary link copied'); }
      else if (how === 'Calendar') V.toast(`${DAYS.reduce((a, x) => a + x.ev.length, 0)} stops added to your calendar`);
      else V.toast(`Opening ${how}…`);
    }));
    $('#dl').addEventListener('click', async (e) => {
      const b = e.currentTarget; if (b.dataset.busy) return; b.dataset.busy = '1';
      const ic = b.innerHTML; b.innerHTML = '<span style="width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin 700ms linear infinite"></span>';
      V.toast('Preparing your itinerary PDF…');
      await V.wait(1200); b.innerHTML = ic; delete b.dataset.busy;
      V.toast(`${d.name} itinerary saved to Files`);
    });
  })();
</script>
</body>
</html>
