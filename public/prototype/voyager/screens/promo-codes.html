<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voyager · Promo Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/voyager.css">
<style>
  .pc-enter { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
  .pc-enter .field { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .pc-enter .field::placeholder { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .pc-enter .btn { height: 44px; width: 96px; }
  .pc-applied { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #E8F8E3; color: #1F6B1F; font-size: 13px; }
  .pc-applied b { color: #0F4F0F; }
  .pc-applied .link { margin-left: auto; color: var(--danger); }
  .pc-sec { margin: 28px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .coupon { position: relative; display: grid; grid-template-columns: 88px 1fr; border-radius: 16px; overflow: hidden; background: var(--grey-1); }
  .coupon + .coupon { margin-top: 12px; }
  .coupon__l { background: var(--navy); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 6px; position: relative; text-align: center; }
  .coupon__l::after { content: ''; position: absolute; right: -1px; top: 8px; bottom: 8px; border-right: 2px dashed var(--grey-1); }
  .coupon__big { font-size: 22px; font-weight: 700; color: var(--orange); line-height: 1; }
  .coupon__small { font-size: 10px; letter-spacing: .15em; color: #C4C7CF; text-transform: uppercase; }
  .coupon__r { padding: 14px 14px 12px 16px; }
  .coupon__t { font-size: 14.5px; font-weight: 700; color: #000; }
  .coupon__d { font-size: 12px; color: var(--text-3); margin-top: 2px; line-height: 1.4; }
  .coupon__meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .code-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; background: #fff; border: 1.5px dashed var(--orange); font-size: 12px; font-weight: 700; letter-spacing: .08em; color: #000; }
  .code-pill svg { color: var(--orange); }
  .coupon__exp { font-size: 11px; color: var(--text-4); margin-left: auto; white-space: nowrap; }
  .coupon__terms { font-size: 11.5px; color: var(--text-3); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid #E6E6E6; }
  .coupon__actions { display: flex; gap: 8px; margin-top: 10px; }
  .coupon__actions .btn { width: auto; flex: 1; }
  .coupon.is-on { box-shadow: inset 0 0 0 1.5px var(--valid); }
  .coupon--dim { opacity: .6; }
  .coupon--dim .coupon__l { background: #8C93A3; }
  .coupon--dim .coupon__big { color: #fff; }
</style>
</head>
<body>
<main class="page page--tabs" aria-label="Promo codes">
  <header class="phead">
    <a class="phead__back tap" href="profile.html" data-go="back" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H3.5M10.5 4.5 3 12l7.5 7.5"/></svg>
    </a>
    <div class="phead__titles"><h1 class="phead__title">Promo Codes</h1></div>
  </header>

  <section class="psheet">
    <form id="form" novalidate class="enter">
      <label class="caps" for="code" style="display:block;margin-bottom:12px">Have A Code?</label>
      <div class="pc-enter">
        <div class="fg"><input class="field" id="code" placeholder="Enter promo code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" data-validate="required" aria-describedby="codeHelp"><span class="helper" id="codeHelp">Applies to your current booking</span></div>
        <button class="btn btn--primary" type="submit" id="apply">Apply</button>
      </div>
    </form>
    <div id="applied"></div>

    <div class="pc-sec"><p class="caps">Available</p><span class="small" id="availCount"></span></div>
    <div id="avail" data-delegate></div>

    <div class="pc-sec"><p class="caps caps--grey">Used &amp; Expired</p></div>
    <div id="used"></div>
  </section>
  <nav data-tabbar="profile"></nav>
</main>

<script src="../assets/js/app.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const EXPIRED = [
    { code: 'SPRING15', title: '15% Spring Break', desc: '15% off city breaks', big: '15%', status: 'Expired Apr 30, 2026' },
    { code: 'FIRSTTRIP', title: 'First Trip Bonus', desc: '$75 off your first booking', big: '$75', status: 'Used · Feb 2026' },
  ];
  const TERMS = {
    SUMMER20: 'Valid on package price for trips departing by Oct 31, 2026. Maximum discount $300. One use per account. Not combinable with other codes.',
    WELCOME50: 'Minimum package spend $500. New and returning members. One use per account.',
    GOLD100: 'Gold and Platinum members only. Trip must be 7 nights or longer. Excludes taxes and add-ons.',
  };
  const big = (p) => p.type === 'pct' ? `${p.value}%` : `$${p.value}`;
  const saving = (code) => { const b = V.booking.get(); const was = V.booking.totals(Object.assign({}, b, { promo: '' })).total; const now = V.booking.totals(Object.assign({}, b, { promo: code })).total; return was - now; };

  const render = () => {
    const cur = V.booking.get().promo; const d = V.booking.dest();
    $('#applied').innerHTML = cur ? `<div class="pc-applied" role="status">${V.icon('check', 18, 'stroke-width="2.6"')}<span><b>${V.esc(cur)}</b> applied to ${V.esc(d.package.name)} · you save ${V.fmt(saving(cur))}</span><button class="link" type="button" id="remove">Remove</button></div>` : '';
    const r = $('#remove'); if (r) r.onclick = async () => { if (!(await V.dialog({ title: `Remove ${cur}?`, message: `Your booking total goes back to ${V.fmt(V.booking.totals(Object.assign({}, V.booking.get(), { promo: '' })).total)}.`, confirm: 'Remove', cancel: 'Keep', tone: 'warn' }))) return; V.booking.set({ promo: '' }); render(); V.toast('Promo code removed'); };
    $('#availCount').textContent = `${V.promos.length} codes`;
    $('#avail').innerHTML = V.promos.map((p) => {
      const on = cur === p.code; const s = saving(p.code);
      return `<article class="coupon enter${on ? ' is-on' : ''}">
        <div class="coupon__l"><span class="coupon__big">${big(p)}</span><span class="coupon__small">off</span></div>
        <div class="coupon__r">
          <p class="coupon__t">${V.esc(p.title)}</p><p class="coupon__d">${V.esc(p.desc)}</p>
          <div class="coupon__meta"><button class="code-pill tap" type="button" data-copy="${p.code}" aria-label="Copy code ${p.code}">${V.esc(p.code)}${V.icon('copy', 14)}</button><span class="coupon__exp">Ends ${V.esc(p.expires.replace(/, \d{4}$/, ''))}</span></div>
          <p class="coupon__terms" id="t-${p.code}" hidden>${V.esc(TERMS[p.code] || '')}</p>
          <div class="coupon__actions">
            <button class="btn btn--xs btn--neutral" type="button" data-terms="${p.code}" aria-expanded="false" aria-controls="t-${p.code}">Terms</button>
            <button class="btn btn--xs ${on ? 'btn--ghost' : 'btn--navy'}" type="button" data-apply="${p.code}" ${on ? 'disabled' : ''}>${on ? 'Applied' : s > 0 ? `Apply · save ${V.fmt(s)}` : 'Apply'}</button>
          </div>
        </div></article>`;
    }).join('');
    $('#used').innerHTML = EXPIRED.map((p) => `<article class="coupon coupon--dim"><div class="coupon__l"><span class="coupon__big">${p.big}</span><span class="coupon__small">off</span></div><div class="coupon__r"><p class="coupon__t">${V.esc(p.title)}</p><p class="coupon__d">${V.esc(p.desc)}</p><div class="coupon__meta"><span class="code-pill" style="border-color:#BDBDBD">${p.code}</span><span class="coupon__exp">${V.esc(p.status)}</span></div></div></article>`).join('');
  };

  const setErr = (msg) => { const inp = $('#code'); const fg = inp.closest('.fg'); fg.classList.add('has-error'); inp.setAttribute('aria-invalid', 'true'); let et = fg.querySelector('.error-text'); if (!et) { et = document.createElement('span'); et.className = 'error-text'; et.setAttribute('role', 'alert'); fg.appendChild(et); } et.innerHTML = V.icon('warning', 14, 'stroke-width="2"') + `<span>${V.esc(msg)}</span>`; inp.focus(); };
  const apply = async (code, btn) => {
    code = String(code || '').trim().toUpperCase();
    const p = V.promo(code);
    if (btn) await V.loading(btn, 800);
    if (!p) { const ex = EXPIRED.find((x) => x.code === code); setErr(ex ? `${code} ${ex.status.startsWith('Used') ? 'has already been used' : 'has expired'}` : `We couldn’t find “${code}”. Check the spelling and try again.`); return false; }
    const s = saving(code);
    if (s <= 0) { const why = p.min ? `Needs a package over $${p.min}` : p.minNights ? `Needs a trip of ${p.minNights}+ nights` : 'Doesn’t apply to this booking'; setErr(`${code} isn’t valid for this booking. ${why}.`); return false; }
    V.booking.set({ promo: code }); $('#code').value = ''; render();
    V.toast(`${code} applied · you save ${V.fmt(s)} · new total ${V.fmt(V.booking.total())}`);
    return true;
  };
  $('#form').addEventListener('submit', (e) => { e.preventDefault(); if (!V.validate($('#form'))) return; apply($('#code').value, $('#apply')); });
  document.addEventListener('click', async (e) => {
    const c = e.target.closest('[data-copy]'); if (c) { try { await navigator.clipboard.writeText(c.dataset.copy); } catch (err) {} V.toast(`${c.dataset.copy} copied`); return; }
    const t = e.target.closest('[data-terms]'); if (t) { const el = document.getElementById('t-' + t.dataset.terms); el.hidden = !el.hidden; t.setAttribute('aria-expanded', String(!el.hidden)); t.textContent = el.hidden ? 'Terms' : 'Hide terms'; return; }
    const a = e.target.closest('[data-apply]'); if (a) { const prev = V.booking.get().promo; if (prev && prev !== a.dataset.apply && !(await V.dialog({ title: `Replace ${prev}?`, message: 'Only one code can be used per booking.', confirm: `Use ${a.dataset.apply}`, cancel: 'Keep', tone: 'warn' }))) return; apply(a.dataset.apply, a); }
  });
  render();
})();
</script>
</body>
</html>
