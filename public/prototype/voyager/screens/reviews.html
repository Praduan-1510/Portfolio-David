<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voyager · Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/voyager.css">
<style>
  .psheet.rv { padding: 26px 17px 24px; }
  .rv-top { display: grid; grid-template-columns: 134px 1fr; column-gap: 22px; align-items: start; margin-top: 26.5px; }
  .rv-top .rating__big { text-align: center; }
  .rv-top .rating__num { font-size: 40px; line-height: 46px; }
  .rv-top .stars { margin-top: 3px; gap: 0; }
  .rv-top .stars svg { width: 21px; height: 21px; margin: 0 -2px; }
  .rv-top .rating__count { font-size: 12px; margin-top: 3px; color: #555; }
  .rv-bars { display: flex; flex-direction: column; gap: 0; margin-top: 3px; }
  .rv-bars button { display: grid; grid-template-columns: 12px 144px; align-items: center; gap: 0; height: 17px; font-size: 11px; color: #555; text-align: left; }
  .rv-bars .bars__track { height: 3px; border-radius: 2px; background: #BDBDBD; }
  .rv-bars button[aria-pressed="true"] .bars__track { box-shadow: 0 0 0 2px var(--orange-tint); }
  .rv-tools { display: flex; align-items: center; gap: 10px; margin: 22px -17px 0 0; }
  .rv-tools .chips { flex: 1; min-width: 0; margin: 0; padding: 0 17px 0 0; gap: 8px; }
  .rv-tools .chip { height: 30px; font-size: 12.5px; padding: 0 14px; }
  .rv-sort { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--navy); height: 44px; padding: 0 17px 0 4px; }
  .rv-list { margin-top: 14px; }
  .review { position: relative; padding: 22px 24px 23px 24px; }
  .review + .review { margin-top: 12px; }
  .review__head { grid-template-columns: 56px 1fr auto; gap: 10px; }
  .review__name { font-size: 15px; line-height: 19px; }
  .review__name + .stars { margin-top: 1px; margin-left: -1px; }
  .review .stars svg { width: 14.5px; height: 14.5px; margin-right: -3.2px; }
  .review__time { font-size: 11px; margin-top: 2px; color: #6B6B6B; }
  .review__text { font-size: 10.4px; line-height: 12px; color: #1A1A1A; margin-top: 12px; }
  .review__photos { display: flex; gap: 8px; margin-top: 10px; }
  .review__photos a { width: 64px; height: 52px; border-radius: 8px; overflow: hidden; display: block; }
  .helpful { position: absolute; right: 18px; top: 50px; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 12px; font-size: 11px; color: #6B6B6B; background: transparent; box-shadow: inset 0 0 0 1px #DADADA; }
  .helpful::after { content: ''; position: absolute; inset: -10px -4px; }
  .helpful[aria-pressed="true"] { background: var(--orange-tint); box-shadow: inset 0 0 0 1px var(--orange); color: #6B4500; }
  .rv-more { margin-top: 16px; }
  .review.is-new { box-shadow: inset 0 0 0 1.5px var(--orange); }
  .review .badge { margin-left: 6px; vertical-align: 2px; }
</style>
</head>
<body>
<main class="page page--tabs" aria-label="Reviews">
  <header class="phead">
    <a class="phead__back tap" href="destination.html?id=paris" data-go="back" id="back" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H3.5M10.5 4.5 3 12l7.5 7.5"/></svg>
    </a>
    <div class="phead__titles"><h1 class="phead__title">Reviews</h1></div>
    <a class="phead__action tap" href="write-review.html?id=paris" id="write"><span data-icon="edit" data-size="16" data-sw="2"></span>Write</a>
  </header>

  <section class="psheet rv">
    <div class="rv-top">
      <div class="rating__big">
        <p class="rating__num num" id="rNum">4.9</p>
        <span id="rStars"></span>
        <p class="rating__count" id="rCount">2,418 Reviews</p>
      </div>
      <div class="rv-bars" id="bars" data-delegate aria-label="Rating breakdown — tap a row to filter"></div>
    </div>

    <div class="rv-tools">
      <div class="chips chips--scroll" id="chips" data-group role="tablist" aria-label="Filter reviews">
        <button class="chip is-active" role="tab" data-value="all">All</button>
        <button class="chip" role="tab" data-value="5">5 ★</button>
        <button class="chip" role="tab" data-value="4">4 ★</button>
        <button class="chip" role="tab" data-value="3">3 ★ &amp; below</button>
        <button class="chip" role="tab" data-value="photos">With photos</button>
      </div>
      <button class="rv-sort tap" type="button" data-sheet="sortSheet" aria-label="Sort reviews"><span id="sortLabel">Recent</span><span data-icon="chevron-down" data-size="12" data-sw="2.6"></span></button>
    </div>

    <div class="rv-list" id="list" data-delegate aria-live="polite"></div>
    <button class="btn btn--outline-soft rv-more" type="button" id="more"><span>Load more reviews</span></button>
  </section>

  <nav data-tabbar="search"></nav>
</main>

<section class="sheet" id="sortSheet" aria-labelledby="sortT">
  <div class="sheet__head">
    <div><p class="sheet__title" id="sortT">Sort reviews</p></div>
    <button class="sheet__close tap" type="button" data-close aria-label="Close"><span data-icon="close" data-size="14" data-sw="2.4"></span></button>
  </div>
  <div class="options" id="sortOpts" data-options>
    <button class="option" type="button" data-value="recent" aria-checked="true"><span class="option__radio"></span><span class="option__body"><span class="option__title">Most recent</span></span></button>
    <button class="option" type="button" data-value="helpful"><span class="option__radio"></span><span class="option__body"><span class="option__title">Most helpful</span></span></button>
    <button class="option" type="button" data-value="high"><span class="option__radio"></span><span class="option__body"><span class="option__title">Highest rating</span></span></button>
    <button class="option" type="button" data-value="low"><span class="option__radio"></span><span class="option__body"><span class="option__title">Lowest rating</span></span></button>
  </div>
</section>

<section class="sheet" id="photoSheet" aria-labelledby="phT">
  <div class="sheet__head">
    <div><p class="sheet__title" id="phT">Traveller photo</p><p class="sheet__sub" id="phSub"></p></div>
    <button class="sheet__close tap" type="button" data-close aria-label="Close"><span data-icon="close" data-size="14" data-sw="2.4"></span></button>
  </div>
  <div class="ph" style="border-radius:16px;overflow:hidden;height:260px"><img id="phImg" src="../assets/img/gal-louvre.jpg" alt=""></div>
</section>

<script src="../assets/js/app.js"></script>
<script>
(function () {
  const V = window.Voyager; const $ = (s) => document.querySelector(s);
  const d = V.dest(V.q('id')) || V.dest('paris'); const id = d.id; const N = d.name;
  document.title = 'Voyager · Reviews · ' + N;
  $('#back').href = `destination.html?id=${id}`;
  $('#write').href = `write-review.html?id=${id}`;
  $('#rNum').textContent = d.rating.toFixed(1);
  $('#rStars').innerHTML = V.starsHTML(5, 17);
  $('#rCount').textContent = V.fmtNum(d.reviews) + ' Reviews';

  const DIST = [78, 58, 38, 28, 10];
  $('#bars').innerHTML = DIST.map((w, i) => `<button type="button" data-star="${5 - i}" aria-pressed="false" aria-label="${5 - i} stars, ${w}% — show only these"><span>${5 - i}</span><span class="bars__track"><span class="bars__fill" style="display:block;width:${w}%"></span></span></button>`).join('');

  // seed reviews (design copy first) + reviews the user wrote on write-review.html
  const SEED = [
    { who: 'Sarah L.', img: 'rev-sarah', ago: 'Days Ago', n: 2, stars: 5, help: 24, text: '"Absolutely Magical Experience. Every Detail Was Perfectly Organised — The Hotel Was Stunning And The Guided Tours Were Informative And Fun."' },
    { who: 'Marcus K.', img: 'rev-marcus', ago: 'Week Ago', n: 7, stars: 5, help: 18, text: `"Voyager Made Our Anniversary Trip Completely Stress-Free. Highly Recommend The ${N} Package!"` },
    { who: 'Daniel G.', img: 'rev-daniel', ago: 'Month Ago', n: 30, stars: 5, help: 11, text: `"The ${N} Package From Voyager Was Seamless. It Turned Our Anniversary Trip Into A Worry-Free Experience!"` },
    { who: 'Frank H.', img: 'rev-frank', ago: 'Month Ago', n: 31, stars: 5, help: 9, text: `"If You're Looking For A Stress-Free Getaway, Voyager's ${N} Package Is A Must. Our Anniversary Was Perfect Thanks To Their Planning!"` },
    { who: 'Emma R.', img: 'agent-emma', ago: '', n: 45, stars: 4, help: 7, photos: id === 'paris' ? ['gal-paris-cafe', 'gal-seine-cruise'] : [d.img], text: `Lovely trip and a great hotel. The evening river cruise was the highlight — only wish the first day had a little more free time.` },
    { who: 'Alex J.', img: 'avatar-alex', ago: '', n: 60, stars: 4, help: 5, photos: id === 'paris' ? ['gal-montmartre'] : [d.hero], text: `Smooth from start to finish. The app kept every booking in one place, and the transfer driver was waiting when we landed.` },
    { who: 'Priya S.', img: 'rev-sarah', ago: '', n: 75, stars: 3, help: 3, text: `Good value, but the guided tour felt rushed and the group was large. The hotel and flights were excellent though.` },
    { who: 'Tom B.', img: 'rev-marcus', ago: '', n: 90, stars: 5, help: 2, photos: id === 'paris' ? ['gal-versailles', 'gal-louvre'] : [], text: `Versailles day trip alone was worth it. Everything ran exactly on time.` },
  ];
  const agoText = (r) => r.label || (r.n < 7 ? `${r.n} Days Ago` : r.n < 28 ? `${Math.round(r.n / 7)} Week${r.n < 14 ? '' : 's'} Ago` : `${Math.round(r.n / 30)} Month${r.n < 45 ? '' : 's'} Ago`);
  const mine = V.store.get('vb:reviews:' + id, []).map((r) => Object.assign({ n: 0, label: 'Just Now', help: 0, mine: true, img: 'avatar-alex', who: 'Alex J.' }, r));
  const all = mine.concat(SEED);
  const helpful = V.store.get('vb:helpful', {});

  let filter = 'all', sort = 'recent', shown = 4;
  const SORT_LABEL = { recent: 'Recent', helpful: 'Helpful', high: 'Highest', low: 'Lowest' };
  const list = $('#list');
  const render = () => {
    let l = all.filter((r) => filter === 'all' ? true : filter === 'photos' ? (r.photos && r.photos.length) : filter === '3' ? r.stars <= 3 : r.stars === +filter);
    const cmp = { recent: (a, b) => a.n - b.n, helpful: (a, b) => b.help - a.help, high: (a, b) => b.stars - a.stars || a.n - b.n, low: (a, b) => a.stars - b.stars || a.n - b.n }[sort];
    l = l.slice().sort(cmp);
    if (!l.length) {
      list.innerHTML = `<div class="empty"><div class="empty__icon">${V.icon('star', 30, 'stroke-width="2"')}</div><p class="empty__title">No reviews match</p><p class="empty__msg">Nobody has left a review like that yet. Try another filter.</p><button class="btn btn--primary btn--inline" type="button" id="showAll" style="width:auto">Show all reviews</button></div>`;
      $('#showAll').onclick = () => $('#chips [data-value="all"]').click();
      $('#more').hidden = true; return;
    }
    list.innerHTML = l.slice(0, shown).map((r, i) => {
      const key = r.who + r.n; const on = !!helpful[key];
      return `<article class="review ${r.mine ? 'is-new' : ''}">
        <div class="review__head">
          <span class="review__avatar ph ph--warm"><img src="${V.img(r.img)}" alt=""></span>
          <div><p class="review__name">${V.esc(r.who)}${r.mine ? '<span class="badge badge--info">You</span>' : ''}</p>${V.starsHTML(r.stars, 11)}</div>
          <p class="review__time">${agoText(r)}</p>
        </div>
        <button class="helpful" type="button" data-help="${V.esc(key)}" aria-pressed="${on}" aria-label="Mark review by ${V.esc(r.who)} as helpful">${V.icon('check', 12, 'stroke-width="2.6"')}<span>${r.help + (on ? 1 : 0)}</span></button>
        ${r.title ? `<p class="review__text" style="font-weight:700;font-size:12px">${V.esc(r.title)}</p>` : ''}
        <p class="review__text" ${r.title ? 'style="margin-top:4px"' : ''}>${V.esc(r.text)}</p>
        ${r.photos && r.photos.length ? `<div class="review__photos">${r.photos.map((p) => `<a class="ph tap" href="#" data-photo="${p}" data-who="${V.esc(r.who)}" aria-label="Open photo by ${V.esc(r.who)}"><img src="${V.img(p)}" alt="" loading="lazy"></a>`).join('')}</div>` : ''}
      </article>`;
    }).join('');
    $('#more').hidden = l.length <= shown;
  };

  list.addEventListener('click', (e) => {
    const h = e.target.closest('[data-help]');
    if (h) {
      const k = h.dataset.help; helpful[k] = !helpful[k]; V.store.set('vb:helpful', helpful);
      h.setAttribute('aria-pressed', String(helpful[k])); const s = h.querySelector('span'); s.textContent = +s.textContent + (helpful[k] ? 1 : -1);
      V.haptic(); if (helpful[k]) V.toast('Thanks — marked as helpful'); return;
    }
    const p = e.target.closest('[data-photo]');
    if (p) { e.preventDefault(); $('#phImg').src = V.img(p.dataset.photo); $('#phSub').textContent = `Shared by ${p.dataset.who} · ${d.name}`; V.sheet.open('photoSheet'); }
  });

  $('#chips').addEventListener('change', (e) => { filter = e.detail; shown = 4; document.querySelectorAll('#bars button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.star === filter))); render(); });
  $('#bars').addEventListener('click', (e) => {
    const b = e.target.closest('[data-star]'); if (!b) return;
    const v = +b.dataset.star >= 4 ? b.dataset.star : '3';
    const chip = $(`#chips [data-value="${filter === v ? 'all' : v}"]`); chip && chip.click();
  });
  $('#sortOpts').addEventListener('select', (e) => { sort = e.detail; $('#sortLabel').textContent = SORT_LABEL[sort]; V.sheet.close(); render(); });
  $('#more').addEventListener('click', async (e) => { await V.loading(e.currentTarget, 600); shown += 4; render(); });

  if (V.q('new')) V.toast('Your review is live — thank you!');
  render();
})();
</script>
</body>
</html>
